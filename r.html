   ・リンク：…/r.html#<id 32桁>.<鍵>（鍵は # の後ろ＝サーバーには送られない）。依頼・回答・ファイルは AES-GCM で暗号化してから送る
   ・RQP.mount(el, io) … io＝{get(), ans(enc,state), fput(fid,blob,m), fdel(fid)}（r.html はサーバー、アプリの中は端末の控え）

var RQC={
  b64(buf){ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); },
  unb64(s){ const b=atob(String(s||"")); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; },
  b64u(buf){ return RQC.b64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  unb64u(s){ s=String(s||"").replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return RQC.unb64(s); },
  hex(n){ const u=crypto.getRandomValues(new Uint8Array(n)); return Array.from(u,x=>x.toString(16).padStart(2,"0")).join(""); },
  newKey(){ return RQC.b64u(crypto.getRandomValues(new Uint8Array(32))); },
  async key(k){ return crypto.subtle.importKey("raw",RQC.unb64u(k),"AES-GCM",false,["encrypt","decrypt"]); },
  async encBuf(key,buf){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,buf); return RQC.b64(iv)+"."+RQC.b64(ct); },
  async decBuf(key,s){ const p=String(s||"").split("."); return crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(RQC.unb64(p[0]))},key,RQC.unb64(p[1])); },
  async enc(key,obj){ return RQC.encBuf(key,new TextEncoder().encode(JSON.stringify(obj))); },
  async dec(key,s){ return JSON.parse(new TextDecoder().decode(await RQC.decBuf(key,s))); }
};

var RQP={
  LANGS:[["ja","日本語"],["en","English"],["zh","中文"],["es","Español"]],
  esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); },

  /* el に描く。io.get() → {ok, req:{…復号済み}, ans:{…復号済み}|null, state, files:[{id,size,m:{name,type,size}}]} */
  async mount(el,io,opt){
    opt=opt||{}; const S={lg:"en",req:null,ans:null,state:"",files:[],busy:false,msg:null};
    if(!document.getElementById("rqpcss")){ const st=document.createElement("style"); st.id="rqpcss"; st.textContent=RQP.css; document.head.appendChild(st); }
    el.classList.add("rqp");
    const T=(k,n)=>RQP.t(S.lg,k,n), E=RQP.esc;
    const fail=(k)=>{ el.innerHTML=`<div class="rqp-w"><div class="rqp-c"><p class="rqp-msg ng">${E(T(k))}</p></div><p class="rqp-brand">${E(T("pw"))}</p></div>`; };
    let r; try{ r=await io.get(); }catch(e){ S.lg=opt.lang||RQP.navLang(); fail("err"); return; }
    if(!r||!r.ok){ S.lg=opt.lang||RQP.navLang(); fail((r&&r.reason)||"none"); return; }
    S.req=r.req; S.ans=r.ans||null; S.state=r.state||""; S.files=r.files||[];
    S.lg=opt.lang||RQP.savedLang()||S.req.lang||RQP.navLang();
    const draw=()=>{
      const q=S.req.q||[], A=(S.ans&&S.ans.a)||{}, left=Math.ceil(((+S.req.exp||0)-Date.now())/864e5), sent=S.state==="sent";
      const fOn=S.req.files&&S.req.files.on, fMax=(S.req.files&&S.req.files.max)||5;
      const cjk=S.lg==="ja"||S.lg==="zh", CO=cjk?"：":": ", PO=cjk?"（":" (", PC=cjk?"）":")";
      try{ if(!opt.preview) document.documentElement.lang=S.lg; }catch(e){}
      el.innerHTML=`<div class="rqp-w">
        <div class="rqp-top"><span class="rqp-brand">${E(S.req.from&&S.req.from.co||"")}</span>
          <label class="rqp-lg">${E(T("lang"))}<select id="rqplg">${RQP.LANGS.map(([k,n])=>`<option value="${k}"${k===S.lg?" selected":""}>${n}</option>`).join("")}</select></label></div>
        ${opt.preview?`<p class="rqp-pv">${E(T("pv"))}</p>`:""}
        <section class="rqp-c"><p class="rqp-from">${E(T("from"))}${CO}${E([S.req.from&&S.req.from.co,S.req.from&&S.req.from.who].filter(Boolean).join(" / "))}</p>
          <h1 class="rqp-h">${E(RQP.pick(S.req.title,S.lg))}${sent?`<span class="rqp-st">${E(T("st_sent"))}</span>`:S.state==="draft"?`<span class="rqp-st" style="background:#fff4ec;color:#8a3d0c">${E(T("st_draft"))}</span>`:""}</h1>
          ${S.req.item?`<p class="rqp-from">${E(RQP.pick(S.req.item,S.lg))}</p>`:""}
          <span class="rqp-due">${E(T("due"))}${CO}${E(RQP.day(S.req.exp,S.lg))}${PO}${E(left<=0?T("today"):T("left",left))}${PC}</span>
          ${S.req.note?`<p class="rqp-note">${E(RQP.pick(S.req.note,S.lg))}</p>`:""}</section>
        <form class="rqp-c" id="rqpf" novalidate>
          <div class="rqp-g2" style="margin-bottom:6px"><div class="rqp-q"><label for="rqp_name">${E(T("name"))}</label><input type="text" id="rqp_name" autocomplete="name" value="${E((S.ans&&S.ans.name)||"")}"></div>
            <div class="rqp-q" style="border-top:0;padding-top:0"><label for="rqp_co">${E(T("co"))}</label><input type="text" id="rqp_co" autocomplete="organization" value="${E((S.ans&&S.ans.co)||(S.req.to&&S.req.to.co)||"")}"></div></div>
          ${q.map((x,i)=>{ const id="rqpq"+i, v=A[x.k]!=null?A[x.k]:"", lab=RQP.pick(x.label,S.lg), help=RQP.pick(x.help,S.lg);
            const inp=x.type==="textarea"?`<textarea id="${id}" data-k="${E(x.k)}">${E(v)}</textarea>`
              :x.type==="select"?`<select class="rqp-in" id="${id}" data-k="${E(x.k)}"><option value=""></option>${(x.opts||[]).map(o=>{ const ov=typeof o==="string"?o:(o.v||RQP.pick(o.l,"en")); return `<option value="${E(ov)}"${ov===v?" selected":""}>${E(typeof o==="string"?o:RQP.pick(o.l,S.lg))}</option>`; }).join("")}</select>`
              :`<input type="${x.type==="date"?"date":x.type==="number"?"number":"text"}" id="${id}" data-k="${E(x.k)}" value="${E(v)}"${x.type==="number"?' inputmode="decimal" step="any"':""}>`;
            return `<div class="rqp-q"><label for="${id}">${E(lab)}${x.req?`<span class="rqp-rq">${E(T("req"))}</span>`:""}</label>${help?`<span class="rqp-help" id="${id}h">${E(help)}</span>`:""}${inp}</div>`; }).join("")}
          ${fOn?`<div class="rqp-q"><label>${E(RQP.pick(S.req.files.label,S.lg)||T("files"))}</label>${S.req.files.help?`<span class="rqp-help">${E(RQP.pick(S.req.files.help,S.lg))}</span>`:""}
            <div class="rqp-fz" id="rqpfz"><button type="button" class="rqp-b g s" id="rqpfb">${E(T("addf"))}</button> ${E(T("drop"))}<br><small>${E(T("fmax",fMax))}</small><input type="file" id="rqpfi" multiple hidden>
            <div class="rqp-fl">${S.files.map(f=>`<div class="rqp-f"><span>${E((f.m&&f.m.name)||f.id)}（${Math.max(1,Math.round(((f.m&&f.m.size)||f.size||0)/1024))} KB）</span><button type="button" class="rqp-b g s" data-rmf="${E(f.id)}">${E(T("rmf"))}</button></div>`).join("")}</div></div></div>`:""}
          <div class="rqp-q"><label for="rqp_note">${E(T("note"))}</label><textarea id="rqp_note">${E((S.ans&&S.ans.note)||"")}</textarea></div>

          <div class="rqp-act">${sent?"":`<button type="button" class="rqp-b g" id="rqpsave">${E(T("save"))}</button>`}<button type="submit" class="rqp-b" id="rqpsend">${E(sent?T("resend"):T("send"))}</button></div>
          <p class="rqp-priv">${E(T("priv"))}${sent?" "+E(T("sentNote")):""}</p></form>
        <p class="rqp-brand">${E(T("pw"))}</p></div>`;
      el.querySelector("#rqplg").onchange=e=>{ S.lg=e.target.value; RQP.saveLang(S.lg); keep(); draw(); };
      el.querySelector("#rqpf").onsubmit=e=>{ e.preventDefault(); go("sent"); };
      const sv=el.querySelector("#rqpsave"); if(sv) sv.onclick=()=>go("draft");
      if(fOn){ const fi=el.querySelector("#rqpfi"), fz=el.querySelector("#rqpfz");
        el.querySelector("#rqpfb").onclick=()=>fi.click(); fi.onchange=()=>addFiles([...fi.files]);
        fz.addEventListener("dragover",e=>{ e.preventDefault(); fz.classList.add("on"); }); fz.addEventListener("dragleave",()=>fz.classList.remove("on"));
        fz.addEventListener("drop",e=>{ e.preventDefault(); fz.classList.remove("on"); addFiles([...(e.dataTransfer&&e.dataTransfer.files||[])]); });
        el.querySelectorAll("[data-rmf]").forEach(b=>b.onclick=async()=>{ if(S.busy) return; S.busy=true; try{ const x=await io.fdel(b.dataset.rmf); if(x&&x.ok) S.files=S.files.filter(f=>f.id!==b.dataset.rmf); else S.msg=["ng",(x&&x.msg)||T("err")]; }catch(e){ S.msg=["ng",T("err")]; } S.busy=false; keep(); draw(); }); }
    };
    const keep=()=>{ const f=el.querySelector("#rqpf"); if(!f) return; const a={}; f.querySelectorAll("[data-k]").forEach(x=>{ a[x.dataset.k]=x.value; });
      S.ans=Object.assign({},S.ans||{},{a,name:(f.querySelector("#rqp_name")||{}).value||"",co:(f.querySelector("#rqp_co")||{}).value||"",note:(f.querySelector("#rqp_note")||{}).value||""}); };
    const addFiles=async(list)=>{ keep(); const max=(S.req.files&&S.req.files.max)||5;
      for(const f of list){ if(S.files.length>=max) break; if(f.size>10*1024*1024){ S.msg=["ng",T("big")+"："+f.name]; continue; }
        S.msg=["ok",T("upl")]; draw();
        try{ const x=await io.fput(f); if(x&&x.ok) S.files.push({id:x.id,size:f.size,m:{name:f.name,type:f.type,size:f.size}}); else S.msg=["ng",(x&&x.msg)||T("err")]; }catch(e){ S.msg=["ng",T("err")]; } }
      if(S.msg&&S.msg[1]===T("upl")) S.msg=null; draw(); };
    const go=async(state)=>{ if(S.busy) return; keep(); const f=el.querySelector("#rqpf"); let bad=false;
      f.querySelectorAll("[data-k]").forEach(x=>{ const q=(S.req.q||[]).find(y=>y.k===x.dataset.k); const no=state==="sent"&&q&&q.req&&!String(x.value||"").trim(); x.classList.toggle("rqp-bad",!!no); x.setAttribute("aria-invalid",no?"true":"false"); if(no&&!bad){ bad=true; x.focus(); } });
      if(bad){ S.msg=["ng",T("need")]; const m=el.querySelector(".rqp-msg"); if(m) m.textContent=T("need"); else { draw(); } return; }
      S.busy=true; const b1=el.querySelector("#rqpsend"), b2=el.querySelector("#rqpsave"); if(b1) b1.disabled=true; if(b2) b2.disabled=true;
      try{ const x=await io.ans(Object.assign({},S.ans,{lang:S.lg,files:S.files.map(f=>({fid:f.id,name:f.m&&f.m.name,size:f.m&&f.m.size,type:f.m&&f.m.type})),at:Date.now()}),state);
        if(x&&x.ok){ S.state=state; S.msg=["ok",state==="sent"?T("sent"):T("saved")]; } else S.msg=["ng",(x&&x.msg)||T("err")]; }
      catch(e){ S.msg=["ng",T("err")]; }
      S.busy=false; draw(); try{ el.scrollIntoView({block:"end"}); }catch(e){} };
    draw();
  },
  navLang(){ const l=String((navigator.languages&&navigator.languages[0])||navigator.language||"en").toLowerCase(); return l.startsWith("ja")?"ja":l.startsWith("zh")?"zh":l.startsWith("es")?"es":"en"; },
  savedLang(){ try{ return localStorage.getItem("rqp_lang")||""; }catch(e){ return ""; } },
  saveLang(l){ try{ localStorage.setItem("rqp_lang",l); }catch(e){} },
  /* r.html：# の後ろからリンクを読み、サーバーとやり取りする */
  async boot(el,url){
    const h=String(location.hash||"").replace(/^#/,""), m=/^([0-9a-f]{32})\.([A-Za-z0-9_-]{40,60})$/.exec(h);
    if(!m){ RQP.mount(el,{get:async()=>({ok:false,reason:"bad"})}); return; }
    const id=m[1]; let key; try{ key=await RQC.key(m[2]); }catch(e){ RQP.mount(el,{get:async()=>({ok:false,reason:"bad"})}); return; }
    const call=async(op,b)=>{ const r=await fetch(url,{method:"POST",mode:"cors",redirect:"follow",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(Object.assign({op,v:1,t:Date.now(),id},b||{}))}); return r.json(); };
    const io={
      get:async()=>{ const r=await call("req_get"); if(!r||!r.ok) return r||{ok:false,reason:"none"};
        const req=await RQC.dec(key,r.enc); req.exp=r.exp||req.exp; let ans=null, state="";
        if(r.ans&&r.ans.enc){ try{ ans=await RQC.dec(key,r.ans.enc); state=r.ans.state; }catch(e){} }
        const files=[]; for(const f of (r.files||[])){ let mm=null; try{ mm=f.m?await RQC.dec(key,f.m):null; }catch(e){} files.push({id:f.id,size:f.size,m:mm}); }
        return {ok:true,req,ans,state,files}; },
      ans:async(a,state)=>call("req_ans",{enc:await RQC.enc(key,a),state}),
      fput:async(f)=>{ const fid=RQC.hex(16); const buf=await f.arrayBuffer(); const blob=await RQC.encBuf(key,buf);
        const x=await call("req_fput",{fid,blob,m:await RQC.enc(key,{name:f.name,type:f.type,size:f.size})}); if(x&&x.ok) x.id=fid; return x; },
      fdel:async(fid)=>call("req_fdel",{fid})
    };
    RQP.mount(el,io);
  }
};

RQP.boot(document.getElementById("rq"),"https://script.google.com/macros/s/AKfycbxw23_UfyVvAgo3uERncVvXosCkoAH9t5h1wyrw4XjHg_yxRUu-HZkgKyNvgUL2W1nrJA/exec");
