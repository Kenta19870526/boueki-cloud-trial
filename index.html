<meta charset="utf-8">
<title>貿易クラウド 2.0 トライアル</title>

<style>
:root{
  color-scheme: light;
  --canvas:#F6F7F9; --chrome:#FFFFFF; --surface:#FFFFFF; --surface-2:#FAFBFC; --sunk:#F1F3F6;
  --line:rgba(70,86,109,.15); --line-2:rgba(70,86,109,.08);
  --ink:#1A1A1A; --ink-2:#46566D; --ink-3:#8A97A6;
  --or:#F8951D; --or-soft:#FFF4E6; --or-deep:#B26B00;
  --bl:#0064BF; --bl-soft:#EDF4FD; --bl-deep:#0F2E5A;
  --good:#12874B; --good-soft:#E6F4EC;
  --warn:#B26B00; --warn-soft:#FDF3E3;
  --crit:#C43D3B; --crit-soft:#FBEBEA;
  --sh:0 1px 3px rgba(70,86,109,.10);
  --sh-2:0 2px 10px rgba(70,86,109,.14);
  --pop:0 10px 34px rgba(26,26,26,.22);
  --r:5px; --r2:8px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --canvas:#0F141A; --chrome:#161C24; --surface:#161C24; --surface-2:#1B222B; --sunk:#121820;
    --line:rgba(150,170,195,.18); --line-2:rgba(150,170,195,.09);
    --ink:#EDF1F6; --ink-2:#A9B7C7; --ink-3:#7C8B9C;
    --or:#F8951D; --or-soft:#3A2A11; --or-deep:#F5B45E;
    --bl:#4C9BE8; --bl-soft:#152B41; --bl-deep:#9BC7F0;
    --good:#3FC77E; --good-soft:#12291E; --warn:#DDA84E; --warn-soft:#2C2211;
    --crit:#E4756F; --crit-soft:#2E1817;
    --sh:0 1px 3px rgba(0,0,0,.5); --sh-2:0 2px 12px rgba(0,0,0,.55);
    --pop:0 12px 40px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --canvas:#0F141A; --chrome:#161C24; --surface:#161C24; --surface-2:#1B222B; --sunk:#121820;
  --line:rgba(150,170,195,.18); --line-2:rgba(150,170,195,.09);
  --ink:#EDF1F6; --ink-2:#A9B7C7; --ink-3:#7C8B9C;
  --or:#F8951D; --or-soft:#3A2A11; --or-deep:#F5B45E;
  --bl:#4C9BE8; --bl-soft:#152B41; --bl-deep:#9BC7F0;
  --good:#3FC77E; --good-soft:#12291E; --warn:#DDA84E; --warn-soft:#2C2211;
  --crit:#E4756F; --crit-soft:#2E1817;
  --sh:0 1px 3px rgba(0,0,0,.5); --sh-2:0 2px 12px rgba(0,0,0,.55); --pop:0 12px 40px rgba(0,0,0,.8);
}
:root[data-theme="light"]{
  color-scheme: light;
  --canvas:#F6F7F9; --chrome:#FFFFFF; --surface:#FFFFFF; --surface-2:#FAFBFC; --sunk:#F1F3F6;
  --line:rgba(70,86,109,.15); --line-2:rgba(70,86,109,.08);
  --ink:#1A1A1A; --ink-2:#46566D; --ink-3:#8A97A6;
  --or:#F8951D; --or-soft:#FFF4E6; --or-deep:#B26B00; --bl:#0064BF; --bl-soft:#EDF4FD; --bl-deep:#0F2E5A;
  --good:#12874B; --good-soft:#E6F4EC; --warn:#B26B00; --warn-soft:#FDF3E3;
  --crit:#C43D3B; --crit-soft:#FBEBEA;
  --sh:0 1px 3px rgba(70,86,109,.10); --sh-2:0 2px 10px rgba(70,86,109,.14); --pop:0 10px 34px rgba(26,26,26,.22);
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);
  font-family:Lato,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif;
  font-size:13px;line-height:1.7;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
.n{font-variant-numeric:tabular-nums}
.lbl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}

/* ── 用語のやさしい説明 ── */
.tm{border-bottom:1px dotted var(--ink-3);cursor:help;position:relative}
body.easy .tm{border-bottom-color:var(--or);background:var(--or-soft);border-radius:2px;padding:0 2px}
.tm:hover::after,.tm:focus::after{content:attr(data-def);position:absolute;left:0;top:calc(100% + 6px);z-index:70;
  width:max-content;max-width:270px;background:var(--ink);color:var(--canvas);font-size:11px;line-height:1.65;
  font-weight:400;padding:7px 10px;border-radius:var(--r2);box-shadow:var(--pop);white-space:normal}

/* ── shell ── */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
body.narrow .app{grid-template-columns:0 minmax(0,1fr)}
body.narrow .side{display:none}
.side{background:var(--chrome);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  overflow-y:auto;display:flex;flex-direction:column}
.logo{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line-2);flex:none}
.logo .mk{width:24px;height:24px;border-radius:5px;background:var(--bl);display:grid;place-items:center;flex:none}
.logo b{font-size:15px;letter-spacing:-.02em;color:var(--bl-deep)}
.logo b i{color:var(--bl);font-style:normal}
nav{padding:8px 8px 4px;display:flex;flex-direction:column;gap:1px}
.ngrp{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--ink-3);padding:11px 10px 5px}
.nb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  color:var(--ink-2);padding:8px 10px;border-radius:var(--r);font-size:12.5px;transition:background .1s}
.nb:hover:not(:disabled){background:var(--sunk)}
.nb:disabled{opacity:.42;cursor:not-allowed}
.nb[aria-current="page"]{background:var(--or-soft);color:var(--or-deep);font-weight:700}
.nb[aria-current="page"] svg{color:var(--or)}
.nb[aria-current="page"] .lyn{background:var(--or);color:#fff}
.nb:focus-visible{outline:2px solid var(--bl);outline-offset:-2px}
.nb svg{flex:none;color:var(--ink-3)}
.lyn{margin-left:auto;font-size:9px;font-weight:700;background:var(--sunk);color:var(--ink-3);padding:1px 5px;border-radius:3px}
.side-ft{margin-top:auto;padding:12px 14px 14px;border-top:1px solid var(--line-2);font-size:9.5px;color:var(--ink-3);line-height:1.65}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;background:var(--chrome);border-bottom:1px solid var(--line);
  height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;flex-wrap:nowrap}
.ham{width:30px;height:30px;border-radius:var(--r);border:0;background:none;color:var(--ink-2);display:grid;place-items:center;flex:none}
.ham:hover{background:var(--sunk)}
.bar .sp{flex:1}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);white-space:nowrap}
.tgl[aria-pressed="true"]{background:var(--or-soft);border-color:var(--or);color:var(--or-deep)}
.tgl .sw{width:22px;height:12px;border-radius:7px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tgl .sw::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl[aria-pressed="true"] .sw{background:var(--or)} .tgl[aria-pressed="true"] .sw::after{transform:translateX(10px)}
.ib{width:30px;height:30px;border-radius:var(--r);border:0;background:none;color:var(--ink-2);display:grid;place-items:center;position:relative;flex:none}
.ib:hover{background:var(--sunk)}
.ib:focus-visible,.tgl:focus-visible,.ham:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
.bdg{position:absolute;top:0;right:0;min-width:14px;height:14px;border-radius:7px;background:var(--crit);color:#fff;
  font-size:8.5px;font-weight:700;display:grid;place-items:center;padding:0 3px;border:1.5px solid var(--chrome)}
.usr{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:var(--r);min-width:0}
.usr>span:last-child{min-width:0;overflow:hidden}
.usr b{font-size:11px;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr span{font-size:9.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#psw{flex:0 1 auto;max-width:200px;min-width:96px}
.usr .av{width:26px;height:26px;border-radius:50%;background:var(--good-soft);color:var(--good);
  display:grid;place-items:center;font-size:10.5px;font-weight:700}

.stage{padding:16px;display:flex;justify-content:center}
.well{width:100%;max-width:1200px;min-width:0;transition:max-width .2s}
body.mob .well{max-width:392px;border:9px solid #24303D;border-radius:24px;padding:10px 9px;background:var(--canvas);box-shadow:var(--pop)}
body.mob .g2,body.mob .g3,body.mob .g4{grid-template-columns:1fr!important}
body.mob .hm{display:none!important}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ph h1{font-size:18px}
.ph .cando{font-size:12px;color:var(--ink-2);margin-top:4px;max-width:64ch}
.ph .cando b{color:var(--ink)}
.lt{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;background:var(--bl-soft);
  color:var(--bl);padding:2px 8px;border-radius:var(--r);white-space:nowrap}
.nt{display:inline-flex;font-size:9px;font-weight:700;background:var(--or-soft);color:var(--or-deep);
  padding:2px 6px;border-radius:3px}
.src{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;background:var(--good-soft);
  color:var(--good);padding:2px 7px;border-radius:3px;white-space:nowrap}

.c{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;box-shadow:var(--sh)}
.c h3{font-size:13px}
.c .nn{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
@media (max-width:1040px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:1180px){.bar .hm{display:none}.bar{gap:7px;padding:0 11px}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .bar{gap:6px;padding:0 10px}
  .stage{padding:12px 10px}.ph h1{font-size:16px}}
@media (max-width:560px){.tgl span:not(.sw){display:none}.tgl{padding:4px 8px}
  #psw{max-width:150px;min-width:80px;font-size:11px;padding:5px 6px}}
.stk{display:flex;flex-direction:column;gap:11px}
.rw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:var(--r);border:1px solid var(--or);
  background:var(--or);color:#fff}
.btn:hover{filter:brightness(1.06)}
.btn.g{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn.g:hover{border-color:var(--or);color:var(--or-deep)}
.btn.b{background:var(--bl);border-color:var(--bl)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.sel{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);color:var(--ink)}
.sel:focus{outline:2px solid var(--or);outline-offset:-1px}

.kv{font-size:25px;font-weight:300;letter-spacing:-.035em;line-height:1.15;margin-top:2px}
.kv small{font-size:11.5px;font-weight:700;letter-spacing:0;margin-left:3px;color:var(--ink-2)}
.kd{font-size:10.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.mt{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:7px}
.mt i{display:block;height:100%;background:var(--or);transition:width .4s}
.mt i.b{background:var(--bl)}

.p{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap}
.p.hi{background:var(--good-soft);color:var(--good)} .p.mid{background:var(--warn-soft);color:var(--warn)}
.p.lo{background:var(--sunk);color:var(--ink-3)} .p.no{background:var(--crit-soft);color:var(--crit)}
.p.on{background:var(--bl-soft);color:var(--bl)} .p.or{background:var(--or-soft);color:var(--or-deep)}

table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--ink-3);border-bottom:1px solid var(--line);
  background:var(--surface);position:sticky;top:0;z-index:1;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover{background:var(--surface-2)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);max-height:380px;overflow-y:auto}

/* ── ステッパー ── */
.stp{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:2px 0 4px}
.stp .s{flex:1;min-width:96px;position:relative;text-align:center}
.stp .s::before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--line)}
.stp .s:first-child::before{display:none}
.stp .s.done::before,.stp .s.now::before{background:var(--or)}
.stp .dot{width:25px;height:25px;border-radius:50%;background:var(--surface);border:2px solid var(--line);
  display:grid;place-items:center;margin:0 auto 5px;position:relative;z-index:1;font-size:10px;font-weight:700;color:var(--ink-3)}
.stp .s.done .dot{background:var(--or);border-color:var(--or);color:#fff}
.stp .s.now .dot{background:var(--surface);border-color:var(--or);color:var(--or);box-shadow:0 0 0 3px var(--or-soft)}
.stp .t{font-size:10px;line-height:1.4;color:var(--ink-3);padding:0 3px}
.stp .s.done .t,.stp .s.now .t{color:var(--ink);font-weight:700}
@media (max-width:700px){.stp .t{display:none}.stp .s{min-width:34px}}
body.mob .stp .t{display:none} body.mob .stp .s{min-width:34px}

/* ── チャット ── */
.chat{display:flex;flex-direction:column;gap:11px;max-height:430px;overflow-y:auto;padding:3px 2px 6px}
.m{display:flex;gap:8px;align-items:flex-start}
.m .av{width:26px;height:26px;border-radius:var(--r);display:grid;place-items:center;flex:none;font-size:10px;font-weight:700}
.m.u .av{background:var(--sunk);color:var(--ink-2)} .m.a .av{background:var(--or);color:#fff}
.bb{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 12px;font-size:12.5px;line-height:1.75;max-width:100%;min-width:0}
.m.u .bb{background:var(--bl-soft);border-color:var(--bl-soft)}
.bb b{color:var(--bl)}
.ci{margin-top:7px;font-size:10.5px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:6px}
.ci b{color:var(--or-deep)}
.qb{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.q{font-size:11.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.q:hover{border-color:var(--or);color:var(--or-deep)}
.q:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.car{display:inline-block;width:6px;height:13px;background:var(--or);vertical-align:-2px;animation:bl .9s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.art{margin-top:9px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
.art .ah{background:var(--sunk);padding:6px 11px;font-size:10.5px;font-weight:700;color:var(--ink-2);
  display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line-2)}
.art .ab{padding:10px 12px}

.doc{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:12px;font-size:10.5px;line-height:1.6}
.doc h4{font-size:11.5px;letter-spacing:.05em;margin-bottom:7px}
.doc .dl{display:grid;grid-template-columns:76px 1fr;gap:2px 8px}
.doc .dl span:nth-child(odd){color:var(--ink-3)}
.doc table{font-size:10px;margin-top:7px} .doc th,.doc td{padding:4px 6px}

.tl{position:relative;padding-left:17px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ti{position:relative;padding-bottom:10px;font-size:11.5px}
.ti::before{content:"";position:absolute;left:-15px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--bl);box-shadow:0 0 0 3px var(--surface)}
.ti.o::before{background:var(--or)} .ti.g::before{background:var(--good)}
.ti time{font-size:10px;color:var(--ink-3);display:block}

.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
@media (max-width:820px){.cmp{grid-template-columns:1fr}}
.cmp>div{padding:12px 14px}
.cmp .o{background:var(--sunk)} .cmp .n2{background:var(--or-soft);border-left:1px solid var(--line)}
.cmp h4{font-size:10.5px;letter-spacing:.04em;margin-bottom:6px}
.cmp .o h4{color:var(--ink-3)} .cmp .n2 h4{color:var(--or-deep)}
.cmp p{font-size:11.5px;line-height:1.7}

.mapw{position:relative;background:var(--sunk);border-radius:var(--r2);overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%)}
.pin i{display:block;width:8px;height:8px;border-radius:50%;background:var(--bl);box-shadow:0 0 0 3px color-mix(in srgb,var(--bl) 20%,transparent)}
.pin.o i{background:var(--or);box-shadow:0 0 0 3px color-mix(in srgb,var(--or) 24%,transparent)}
.pin span{position:absolute;left:12px;top:-6px;font-size:9.5px;font-weight:700;white-space:nowrap;color:var(--ink-2)}

.dw{position:fixed;inset:0;z-index:60;display:none}
.dw[data-open="true"]{display:block}
.dw .sc{position:absolute;inset:0;background:rgba(20,26,34,.42)}
.dw .pn{position:absolute;top:0;right:0;height:100%;width:min(440px,100%);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--pop);overflow-y:auto;padding:15px 17px 28px}
.dw h3{font-size:14px} .dw .cl{position:absolute;top:11px;right:13px}
.fld{display:grid;grid-template-columns:100px minmax(0,1fr);gap:5px 10px;font-size:11.5px;padding:5px 0;border-bottom:1px dashed var(--line-2)}
.fld dt{color:var(--ink-3);font-size:10.5px} .fld dd{margin:0;font-weight:700}
.nf{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.nf .d{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.nf time{font-size:10px;color:var(--ink-3);display:block;margin-top:1px}

/* ── アップロード ── */
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--surface);padding:30px 20px;text-align:center;
  transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--or);background:var(--or-soft)}
.drop .ic{width:52px;height:52px;border-radius:50%;background:var(--or-soft);color:var(--or);display:grid;place-items:center;margin:0 auto 11px}
.drop.over .ic{background:var(--surface)}
.drop h3{font-size:15px}
.drop p{font-size:11.5px;color:var(--ink-2);margin-top:5px}
.smp{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);padding:13px 14px;text-align:left;
  display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s;cursor:pointer;width:100%}
.smp:hover{border-color:var(--or);box-shadow:var(--sh-2)}
.smp .ttl{display:flex;align-items:center;gap:8px}
.smp .cat{width:30px;height:30px;border-radius:var(--r2);display:grid;place-items:center;font-size:15px;flex:none}
.smp b{font-size:12.5px;display:block;line-height:1.4}
.smp .co{font-size:10px;color:var(--ink-3)}

   a:`たまっている<b>27件の商談記録</b>と規制の調査結果から、おすすめの順番は次のとおりです。<br><br>
   <b>1位：香港</b>　記録8件・手応えありが3件。関税0%、{通関}も1〜2営業日。すでに初回の受注が1件あります。<br>

   <b>3位：台湾</b>　記録3件でギフト需要がはっきりしています。ただし<b>関税が17%</b>なので、卸価格の見直しが必要です。<br><br>

  {q:"明日の商談、何を聞かれそうですか？",
   a:`香港・輸入商社との過去の商談<b>3件</b>から、聞かれそうなことは3つに絞れます。<br><br>
   <b>① 業務用1kg規格はあるか</b>　前回（7/22）に先方から出た話です。価格表では US$103／kg（100〜）。<br>
   <b>② 賞味期限は何ヶ月か</b>　同じ香港のCafé Groupが「18ヶ月ないと難しい」で断ってきています。現在は12ヶ月。<br>
   <b>③ 毎月どれくらい出せるか</b>　アメリカのNordic社からも同じ質問が来ています。<br><br>
   <b>想定される質問</b>：「1kg規格はいつから出せますか」「賞味期限を延ばす予定はありますか」「月にどれくらい作れますか」`,
   c:"根拠：香港の商談記録 3件／同じ相手との過去のやりとり 2件／価格表 5SKU／同業態の記録 4件"},
  {q:"なぜ話が止まったのか、まとめてください。",
   a:`断られた・止まっている<b>6件</b>の理由をまとめました。<br><br>
   <b>{ハラル認証}がない：2件</b>（UAE・マレーシア）── 取れば両国＋見込み7社が動きます。<br>
   <b>価格が競合より32%高い：1件</b>（タイ）── 量販店では価格が優先されます。専門店・ギフト向けに寄せるのが現実的です。<br>
   <b>{MOQ}に届かない：1件</b>（オーストラリア）── 先方は50kg希望、こちらは100kgから。<br>
   <b>賞味期限が短い：1件</b>（香港）── 12ヶ月→18ヶ月にできれば解消できそうです。<br>
   <b>優先順位で保留：1件</b>（香港ほうじ茶）── 抹茶の取引ができてから再開します。<br><br>
   <b>打ち手は2つ</b>。ハラル認証の取得（4〜6ヶ月・60〜120万円）で推定¥9.2M、
   賞味期限の延長で推定¥4.6Mの商談が動き出します。`,

 aiq:[
  {q:"この商品、どの国に売れますか？",
   a:`たまっている<b>23件の商談記録</b>と規制の調査結果から、優先順位は次のとおりです。<br><br>
   <b>1位：台湾</b>　記録5件・手応えありが3件。TFDA登録は取得済み、関税0%。すでに600本の受注があります。<br>
   <b>2位：韓国</b>　記録3件。標準通関予定報告のみで参入でき、障壁が低い。1,000本の引き合いが動いています。<br>
   <b>3位：香港</b>　記録4件。<b>事前届出が不要</b>な数少ない市場で、いちばん早く売り始められます。<br><br>
   <b>いま伸びしろが大きいのはアメリカです。</b>MoCRAの施設登録は<b>1〜2ヶ月・20万円</b>で済むのに、
   未対応というだけで1件失注しています。投資対効果でいえば最優先の候補です。<br><br>
   一方、<b>中国とEUは時間とお金がかかります。</b>中国のNMPA備案は4〜6ヶ月・100〜200万円、
   EUのCPNP＋CPSRは3〜4ヶ月・80〜150万円。中国は年間5万本の引き合いがあるので、投資判断の価値はあります。`,
   c:"根拠：商談記録 23件（台5・香4・韓3・星3・中2・米2・泰2・仏2）／規制調査 7か国／断られた理由 4件"},
  {q:"明日の商談、何を聞かれそうですか？",
   a:`台湾・セレクトショップとの過去の商談<b>2件</b>と、同業態の記録から、論点は3つです。<br><br>
   <b>① 全成分（INCI）の開示</b>　化粧品では必ず聞かれます。<b>コメ発酵液30%配合</b>という数字を出せるのは強みです。<br>
   <b>② 動物実験の有無</b>　クリーンビューティ訴求のバイヤーは必ず確認します。原料段階から非実施です。<br>
   <b>③ 50mLの追加とテスター</b>　前回（7/24）に先方から出ています。50mLは US$28.00（300〜）。<br><br>
   <b>想定される質問</b>：「防腐剤は何を使っていますか」「パッチテストの結果はありますか」
   「テスターは何本もらえますか」「50mLはいつから出せますか」<br><br>
   なお香港の Pure Glow 社からは<b>10mLトライアルの同梱</b>という提案が来ています。同じ話が出る可能性があります。`,
   c:"根拠：台湾の商談記録 2件／同業態（セレクトショップ・ドラッグストア）4件／全成分表12成分／価格表 4SKU"},
  {q:"なぜ話が止まったのか、まとめてください。",
   a:`断られた<b>4件</b>は、<b>すべて「各国の届出・登録が未対応」という同じ理由</b>でした。商品への評価はいずれも高いままです。<br><br>
   <b>CPNP届出・CPSR未対応：1件</b>（フランス）── 3〜4ヶ月・80〜150万円<br>
   <b>NMPA備案未取得：1件</b>（中国）── 4〜6ヶ月・100〜200万円／年間5万本規模の引き合いでした<br>
   <b>MoCRA未対応：1件</b>（アメリカ）── <b>1〜2ヶ月・20万円</b>／いちばん安く早い<br>
   <b>ESMA登録未対応：1件</b>（UAE）── 2〜3ヶ月・30万円<br><br>
   <b>これは価格や品質の問題ではありません。手続きの問題です。</b>
   費用対効果の順に並べると <b>①アメリカ ②UAE ③EU ④中国</b>。
   まずMoCRAに対応すれば、20万円で失注1件＋見込み3社が動き出します。`,

/* ═══════════ ② アップロードしたファイルを実際に解析する ═══════════
   XLSX は ZIP。ブラウザ標準の DecompressionStream('deflate-raw') で展開し、
   sharedStrings と各シートの XML を読んで実データを取り出します（外部ライブラリ不使用）。 */

async function inflateRaw(u8){
  if(typeof DecompressionStream==="undefined") throw new Error("no-ds");
  const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), out={};
  let eo=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--)
    if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error("not-zip");
  const n=dv.getUint16(eo+10,true), cd=dv.getUint32(eo+16,true);
  let p=cd;
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const meth=dv.getUint16(p+10,true), csz=dv.getUint32(p+20,true),
      nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true),
      lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    p+=46+nl+el+cl;
    if(!/^(xl\/|docProps\/)/.test(name)) continue;
    const lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true);
    const ds=lho+30+lnl+lel, raw=u8.subarray(ds,ds+csz);
    try{ out[name]=meth===8?await inflateRaw(raw):raw; }catch(e){}
  }
  return out;
}
const XT=u8=>new TextDecoder("utf-8").decode(u8);
const colNum=r=>{let c=0;for(const ch of r.replace(/\d+/g,""))c=c*26+(ch.charCodeAt(0)-64);return c;};

function parseSheet(xml,ss){
  const doc=new DOMParser().parseFromString(xml,"application/xml"), grid=[];
  doc.querySelectorAll("row").forEach(row=>{
    const ri=+row.getAttribute("r")-1; grid[ri]=grid[ri]||[];
    row.querySelectorAll("c").forEach(c=>{
      const ref=c.getAttribute("r")||"", ci=colNum(ref)-1, t=c.getAttribute("t");
      let v="";
      if(t==="s"){ const i=c.querySelector("v"); v=i?(ss[+i.textContent]||""):""; }
      else if(t==="inlineStr"){ v=[...c.querySelectorAll("is t")].map(x=>x.textContent).join(""); }
      else { const i=c.querySelector("v"); v=i?i.textContent:""; }
      if(ci>=0) grid[ri][ci]=String(v).trim();
    });
  });
  for(let i=0;i<grid.length;i++) grid[i]=grid[i]||[];
  return grid;
}
async function readWorkbook(file){
  const files=await unzip(await file.arrayBuffer());
  let ss=[];
  if(files["xl/sharedStrings.xml"]){
    const d=new DOMParser().parseFromString(XT(files["xl/sharedStrings.xml"]),"application/xml");
    ss=[...d.querySelectorAll("si")].map(si=>[...si.querySelectorAll("t")].map(t=>t.textContent).join(""));
  }
  const names=[], rels={};
  if(files["xl/workbook.xml"]){
    const d=new DOMParser().parseFromString(XT(files["xl/workbook.xml"]),"application/xml");
    [...d.querySelectorAll("sheet")].forEach(s=>names.push(s.getAttribute("name")||""));
  }
  const sheets=[];
  Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k))
    .sort((a,b)=>(+a.match(/\d+/)[0])-(+b.match(/\d+/)[0]))
    .forEach((k,i)=>sheets.push({name:names[i]||("シート"+(i+1)),grid:parseSheet(XT(files[k]),ss)}));
  return sheets;
}
function parseCSV(txt){
  const rows=txt.split(/\r?\n/).filter(l=>l.length).map(l=>{
    const out=[];let cur="",q=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(q){ if(ch==='"'&&l[i+1]==='"'){cur+='"';i++;} else if(ch==='"'){q=false;} else cur+=ch; }
      else { if(ch==='"')q=true; else if(ch===","){out.push(cur.trim());cur="";} else cur+=ch; }}
    out.push(cur.trim());return out;});
  return [{name:"CSV",grid:rows}];
}

const norm=s=>String(s||"").toLowerCase().replace(/[\s　（）()・:：]/g,"");
function findKV(sheets){
  const got={};
  sheets.forEach(sh=>sh.grid.forEach(row=>{
    if(!row||!row.length) return;
    /* 表のヘッダー行・データ行（3セル以上埋まっている行）は項目名として扱わない */
    if(row.filter(x=>x&&String(x).trim()).length>=3) return;
    const a=norm(row[0]); if(!a||a.length>14) return;
    const b=(row.slice(1).find(x=>x&&String(x).trim())||"").toString().trim();
    if(!b) return;
    const hit=l=>{const L=norm(l);return a===L||a.startsWith(L)||(a.length<=10&&a.endsWith(L));};
    for(const k in LBL) if(!got[k]&&LBL[k].some(hit)) got[k]=b;
  }));
  return got;
}
/* 社名（前置き・後置き・英文のいずれの形でも拾う） */
function findCompany(sheets,allTxt){
  const head=sheets.map(s=>(s.grid||[]).slice(0,4).map(r=>(r||[]).join(" ")).join("\n")).join("\n");
  const PATS=[/[^\s／\/、,。\n]{2,18}(?:株式会社|有限会社|合同会社)/,
    /(?:株式会社|有限会社|合同会社)[^\s／\/、,。\n]{2,18}/,
    /[A-Za-z][A-Za-z0-9&.,'’ -]{2,40}?(?:Co\.,? ?Ltd\.?|Inc\.?|Corp\.?|GmbH|Pte\.? ?Ltd\.?)/];
  for(const src of [head,allTxt]) for(const re of PATS){ const m=src.match(re); if(m) return m[0].trim(); }
  return "";
}
function findStrengths(sheets){
  const out=[];
  sheets.forEach(sh=>sh.grid.forEach(row=>{
    if(!row) return;
    if(/^(強み|特徴|selling|強み\d|特長)/.test(norm(row[0]))||/^強み\d/.test(String(row[0]||""))){
      const t=(row[1]||"").trim(), d=(row.slice(2).find(x=>x&&x.trim())||"").trim();
      if(t) out.push([t,d||""]);
    }
  }));
  return out;
}
/* 表の検出：ヘッダー行＋2行以上のデータ */
function findTables(grid){
  const tabs=[];
  for(let i=0;i<grid.length;i++){
    const h=(grid[i]||[]).filter(x=>x&&x.trim());
    if(h.length<3) continue;
    const cols=(grid[i]||[]).map(x=>(x||"").trim());
    const rows=[];
    for(let j=i+1;j<grid.length;j++){
      const r=(grid[j]||[]).map(x=>(x||"").trim());
      if(r.filter(x=>x).length<Math.max(2,Math.floor(h.length*0.5))) break;
      rows.push(r.slice(0,cols.length));
    }
    if(rows.length>=2){ tabs.push({cols:cols.filter((c,k)=>k<cols.length),rows,at:i}); i+=rows.length; }
  }
  return tabs;
}
const HDR={price:["moq","価格","単価","price","卸","通貨","リードタイム","〜","以上"],
 dim:["w×d×h","wxdxh","寸法","内径","外径","重量","正味","総重量","入数","質量","幅","mm"],
 comp:["成分","材質","inci","原材料","含有","配合","規格","部品","項目","内容","材料"]};
function classify(t){
  const s=norm(t.cols.join("|"));
  const sc=k=>HDR[k].reduce((a,w)=>a+(s.includes(norm(w))?1:0),0);
  const p=sc("price"),d=sc("dim"),c=sc("comp");
  const m=Math.max(p,d,c);
  return m===0?null:(p===m?"price":d===m?"dim":"comp");
}
function detectCat(all){
  const s=all.toLowerCase();
  const sc=(ws)=>ws.reduce((a,w)=>a+(s.split(w).length-1),0);
  const scores={
    food:sc(["食品","茶","飲料","原材料","アレルゲン","賞味期限","栄養成分","haccp","農薬"]),
    cosme:sc(["化粧品","inci","美容液","スキンケア","配合率","薬事","cpnp","mocra","nmpa","全成分"]),
    parts:sc(["部品","材質","軸受","機械","rohs","reach","硬度","公差","jis","該非","ベアリング","鋼"]),
    daily:sc(["雑貨","タンブラー","タオル","食器","キッチン","文具","日用","収納","食洗機"]),
    car:sc(["中古車","車両","走行距離","車検","年式","排気量","修復歴","オークション","車台番号","rono","ro-ro"]),
    liquor:sc(["日本酒","清酒","純米","吟醸","酒税","アルコール分","醸造","精米歩合","ウイスキー","焼酎"]),
    apparel:sc(["アパレル","衣料","デニム","縫製","生地","サイズ展開","綿100","ポリエステル","oeko"]),
    medical:sc(["医療","滅菌","ガーゼ","絆創膏","包帯","iso13485","クラスi","衛生材料","医療機器"]),
  };
  let best=null,bv=0;
  Object.entries(scores).forEach(([k,v])=>{ if(v>bv){bv=v;best=k;} });

}
/* HSコードらしき数字を全部拾い、文脈に HS／関税／品目 がある候補を優先。日付は除外 */
function pickHS(txt,cat){
  const re=/(\d{4})[.．]?(\d{2})/g; let m, best=null;
  while((m=re.exec(txt))){
    const a=+m[1], b=+m[2];
    if(a>=1900&&a<=2100&&b>=1&&b<=12) continue;             // 年月とみなす
    if(/[-\/]/.test(txt.slice(m.index-1,m.index))) continue; // 日付の一部
    const ctx=txt.slice(Math.max(0,m.index-40),m.index+8);
    if(/hs|ＨＳ|関税|品目|分類|tariff/i.test(ctx)) return {hs:m[1]+"."+m[2],ok:true};
    if(!best&&a>=100) best=m[1]+"."+m[2];
  }
  return {hs:{food:"2106.90",cosme:"3304.99",parts:"8479.89"}[cat]||"",ok:false};
}

async function buildTenant(file){
  let sheets;
  if(/\.(xlsx|xlsm)$/i.test(file.name)) sheets=await readWorkbook(file);
  else if(/\.(csv|txt)$/i.test(file.name)) sheets=parseCSV(await file.text());
  else throw new Error("unsupported");
  const allTxt=sheets.map(s=>s.grid.map(r=>(r||[]).join(" ")).join("\n")).join("\n");
  const kv=findKV(sheets), cat=detectCat(allTxt);
  const tabs=[]; sheets.forEach(sh=>findTables(sh.grid).forEach(t=>tabs.push({...t,sheet:sh.name})));
  const pick=k=>{const c=tabs.filter(t=>classify(t)===k);
    return c.sort((a,b)=>b.rows.length*b.cols.length-a.rows.length*a.cols.length)[0]||null;};
  const pt=pick("price"), dt=pick("dim"), ct=pick("comp");
  const HSR=(kv.hs&&/\d{4}/.test(kv.hs))
    ?{hs:kv.hs.match(/\d{4}[.．-]?\d{2}/)[0].replace(/[．-]/,"."),ok:true}
    :pickHS(allTxt,cat);
  const strengths=findStrengths(sheets);
  const co=kv.co||findCompany(sheets,allTxt);
  const t={
    src:"upload", file:file.name, sheets:sheets.map(s=>s.name),
    cat:{food:"食品",cosme:"化粧品",parts:"工業部品",daily:"日用雑貨",car:"中古車",
      liquor:"酒類",apparel:"アパレル",medical:"医療・衛生用品"}[cat]||"", catKey:cat,
    co:(co||"").trim(), coEn:kv.coEn||"", item:kv.item||"", itemEn:kv.itemEn||"",
    sku:kv.sku||"", origin:kv.origin||"", cert:kv.cert||"", shelf:kv.shelf||"",
    store:kv.store||"", msrp:kv.msrp||"", term:kv.term||"", pay:kv.pay||"",
    pol:kv.pol||"", lead:kv.lead||"", moq:kv.moq||"", ctn:kv.ctn||"",
    hs:HSR.hs, hsGuess:!HSR.ok,
    priceCols:pt?pt.cols:[], priceRows:pt?pt.rows:[],
    dimCols:dt?dt.cols:[], dimRows:dt?dt.rows:[],
    compCols:ct?ct.cols:[], compRows:ct?ct.rows:[],
    compTitle:cat==="parts"?"材質・素材表":cat==="cosme"?"全成分表（INCI）"
      :cat==="daily"?"材質・素材表":cat==="car"?"車両情報表":cat==="apparel"?"素材・仕様表"
      :cat==="medical"?"構成・規格表":cat==="liquor"?"成分・スペック表":"成分表",
    strengths, targets:[], nSheets:sheets.length, nTables:tabs.length
  };
  if(!t.moq&&pt){ const i=pt.cols.findIndex(c=>/moq|最小|最低/i.test(norm(c)));
    if(i>=0&&pt.rows[0]&&pt.rows[0][i]) t.moq=pt.rows.map(r=>r[i]).filter(Boolean)[0]; }
  if(!t.lead&&pt){ const i=pt.cols.findIndex(c=>/リードタイム|納期|lead/i.test(norm(c)));
    if(i>=0&&pt.rows[0]&&pt.rows[0][i]) t.lead=pt.rows.map(r=>r[i]).filter(Boolean)[0]; }
  return t;
}

const WSUM=NEED.reduce((a,x)=>a+x.w,0);
function scoreOf(t){
  const filled=NEED.filter(x=>has(t[x.k]));
  return {filled,missing:NEED.filter(x=>!has(t[x.k])),
    pct:Math.round(filled.reduce((a,x)=>a+x.w,0)/WSUM*100)};
}
/* HSコード候補（カテゴリ＋商品名から） */
function hsCandidates(t){
  const s=(t.item+" "+t.cat).toLowerCase();
  const T=[[/茶|matcha|tea/,"0902.10","茶（緑茶・粉末）"],[/菓子|チョコ|candy/,"1806.90","菓子類"],
   [/調味|醤油|味噌|sauce/,"2103.90","調味料"],[/酒|sake|wine/,"2208.90","酒類"],
   [/美容液|化粧水|クリーム|serum|cream|スキンケア/,"3304.99","スキンケア化粧品"],
   [/シャンプー|ヘア|shampoo/,"3305.10","毛髪用製品"],[/石鹸|soap/,"3401.11","石けん"],
   [/軸受|ベアリング|bearing/,"8482.10","玉軸受"],[/ポンプ|pump/,"8413.70","ポンプ"],
   [/バルブ|valve/,"8481.80","バルブ"],[/モーター|motor/,"8501.10","電動機"],
   [/タンブラー|魔法瓶|水筒|ボトル|tumbler|flask/,"9617.00","魔法瓶類"],
   [/タオル|towel/,"6302.60","タオル（綿）"],[/陶器|磁器|食器|tableware/,"6912.00","陶磁器製食卓用品"],
   [/中古車|乗用車|ハイブリッド|自動車|car|vehicle/,"8703.60","乗用車（HV）"],
   [/日本酒|清酒|純米|大吟醸|sake/,"2206.00","清酒"],[/ウイスキー|whisky/,"2208.30","ウイスキー"],
   [/デニム|ジーンズ|denim|jeans/,"6203.42","男子用ズボン（綿）"],
   [/ガーゼ|絆創膏|包帯|gauze|bandage/,"3005.90","医療用衛生材料"],
   [/衣料|アパレル|シャツ|apparel/,"6205.20","男子用シャツ"],[/食品|food/,"2106.90","調製食料品"]];
  const hit=T.filter(([re])=>re.test(s)).map(([,c,n])=>[c,n]);
  return hit.length?hit:[[{食品:"2106.90",化粧品:"3304.99",工業部品:"8479.89",日用雑貨:"7323.99",
    中古車:"8703.60",酒類:"2206.00",アパレル:"6203.42","医療・衛生用品":"3005.90"}[t.cat]||"9999.99",
    "カテゴリからの推定（要確認）"]];
}
/* 入力の解釈 */
function applyAnswer(t,k,raw){
  const v=String(raw).trim();
  if(!v) return false;
  if(k==="targets"){ t.targets=v.split(/[、,\/／\s]+/).filter(Boolean); return true; }
  if(k==="cat"){ t.cat=v; t.catKey=catKeyOf(v); return true; }
  if(k==="hs"){
    const m=v.match(/\d{4}[.．-]?\d{2}/);
    if(m){ t.hs=m[0].replace(/[．-]/,"."); t.hsGuess=false; return true; }
    const c=hsCandidates(t); t.hs=c[0][0]; t.hsGuess=true; t._hsNote=c; return true;
  }
  if(k==="strengths"){
    const parts=v.split(/[、,／\/\n]|。/).map(s=>s.trim()).filter(s=>s.length>1);
    t.strengths=(t.strengths||[]).concat(parts.map(s=>[s,""])); return true;
  }
  if(k==="priceRows"){
    const rows=v.split(/[\n／\/]/).map(s=>s.trim()).filter(Boolean)
      .map(s=>{const m=s.match(/^(.*?)[\s:：]*((?:US\$|\$|¥|￥)?[\d,]+(?:\.\d+)?)\s*$/);
        return m?[m[1].trim()||"標準",m[2]]:[s,""];});
    if(rows.length){ t.priceCols=["数量帯","単価"]; t.priceRows=rows; return true; }
    return false;
  }
  if(k==="dimRows"){
    const rows=v.split(/[\n／\/]/).map(s=>s.trim()).filter(Boolean).map(s=>[s]);
    if(rows.length){ t.dimCols=["寸法・重量"]; t.dimRows=rows; return true; }
    return false;
  }
  if(k==="compRows"){
    const rows=v.split(/[\n、,／\/]/).map(s=>s.trim()).filter(Boolean).map(s=>[s,"",""]);
    if(rows.length){ t.compCols=["項目","内容","備考"]; t.compRows=rows; return true; }
    return false;
  }
  t[k]=v; return true;
}

function fillNext(){
  const s=scoreOf(TEN);
  if(!s.missing.length){
    if(typeof llmExtraHook==="function"&&llmExtraHook()) return;
    FILL.cur=null;
    fillSay("ai",`<b>これで全項目が揃いました。充足度 100%。</b><br>

      <b>「この状態にすること」が、2年間の980万円で行っていることそのもの</b>です。`,{done:1});
    render(); return;
  }
  const nx=s.missing.sort((a,b)=>b.w-a.w)[0];
  FILL.cur=nx; FILL.sel=[];
  fillSay("ai",`<span class="p or">残り ${s.missing.length}項目・充足度 ${s.pct}%</span><br>
    <b>${nx.n}</b>を教えてください。<br>${nx.q}
    ${nx.ex?`<br><span style="color:var(--ink-3);font-size:11px">${nx.ex}</span>`:""}

  render();
}
function fillAnswer(v){
  if(!FILL.cur) return;
  const k=FILL.cur.k, n=FILL.cur.n;
  fillSay("u",esc(v));
  const ok=applyAnswer(TEN,k,v);
  if(!ok){ fillSay("ai",`うまく読み取れませんでした。${FILL.cur.ex||"もう少し具体的にご記入ください。"}`); render(); return; }
  const s=scoreOf(TEN);
  let note="";
  if(k==="hs"&&TEN.hsGuess&&TEN._hsNote)
    note=`<br>商品名から<b>${TEN.hs}</b>（${TEN._hsNote[0][1]}）と推定しました。正式な分類は税関の事前教示で確定できます。`;
  if(k==="targets"&&TEN.targets.length)
    note=`<br><b>${TEN.targets.length}か国</b>の規制調査を開始しました。関税率と必要書類は「貿易実務・書類」で確認できます。`;
  if(k==="dimRows") note="<br>これで<b>運送会社への見積依頼</b>ができるようになりました。";
  if(k==="priceRows") note="<br>これで<b>見積書・請求書の自動作成</b>ができるようになりました。";
  if(k==="strengths") note="<br>AIが商談準備の答えを作るとき、ここを根拠として引用します。";
  fillSay("ai",`<b>${n}</b>を登録しました。充足度 <b>${s.pct}%</b>（+${Math.round(FILL.cur.w/WSUM*100)}pt）${note}`);
  syncTenant();
  fillNext();
}

function catKeyOf(label){

  if(/工業|部品|parts/i.test(s)) return "parts";

function bnRnd(seed){ let a=(seed*2654435761)>>>0;
  return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function bnPick(r,arr){ return arr[Math.floor(r()*arr.length)]; }
function bnWeek(now){ return Math.max(0,Math.floor(((now||new Date())-BN_EPOCH)/(7*864e5))); }
function bnAdds(w){ const r=bnRnd(9100+w); return 14+Math.floor(r()*22); }  /* 週14〜35名 */
function bnTotal(now){ let t=BN_BASE; const W=bnWeek(now); for(let w=0;w<=W;w++) t+=bnAdds(w); return t; }
function bnGen(i){
  const r=bnRnd(i+77);
  let cv=r(), cty=BN_CTY[BN_CTY.length-1][0];
  const csum=BN_CTY.reduce((a,x)=>a+x[1],0); let acc=0;
  for(const [c,n] of BN_CTY){ acc+=n/csum; if(cv<acc){cty=c;break;} }
  let kv=r(), cat="other";
  let a2=0; for(const [k,,w] of BN_CATS){ a2+=w; if(kv<a2){cat=k;break;} }
  const biz=bnPick(r,BN_BIZ[cat]||BN_BIZ.def.concat(BN_BIZ[cat==="food"?"food":"def"]||[]));
  const size=bnPick(r,["年商 $1M未満","年商 $1〜5M","年商 $5〜20M","年商 $20M超","年商 $5〜20M","年商 $1〜5M"]);
  const dl=r(); const deals=dl<.55?0:dl<.85?1+Math.floor(r()*3):dl<.97?4+Math.floor(r()*6):10+Math.floor(r()*9);
  const lv=deals>=4?"高":r()<.14?"高":r()<.55?"中":"−";
  const days=1+Math.floor(r()*90);
  const ints=[bnPick(r,BN_INT[cat]||BN_INT.other)]; if(r()<.4){const x=bnPick(r,BN_INT[cat]||BN_INT.other); if(!ints.includes(x)) ints.push(x);}
  const id=(BN_CC[cty]||"XX")+"-"+String(1000+Math.floor(r()*9000));
  return {i,id,cty,cat,catNm:(BN_CATS.find(c=>c[0]===cat)||["","その他"])[1],biz,size,deals,lv,days,ints};
}
/* 今週＋先週に追加されたバイヤー */
function bnNew(now){
  const W=bnWeek(now), out=[];
  [W,W-1].forEach(w=>{ if(w<0) return;
    const n=bnAdds(w); let cum=0; for(let k=0;k<w;k++) cum+=bnAdds(k);
    const r=bnRnd(500+w);
    for(let j=0;j<n;j++){
      const b=bnGen(100000+cum+j);
      const d=new Date(BN_EPOCH.getTime()+(w*7+Math.floor(r()*7))*864e5);
      out.push({...b,deals:0,lv:j%9===0?"高":j%3===0?"中":"−",days:0,isNew:w===W,
        added:`${d.getMonth()+1}/${d.getDate()}`});
    }});
  return out.sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0));
}
function bnQuery(f){
  f=f||{};
  const out=[];
  for(let i=0;i<900&&out.length<220;i++){
    const b=bnGen(i);
    if(f.cty&&b.cty!==f.cty) continue;
    if(f.cat&&b.cat!==f.cat) continue;
    if(f.lv&&b.lv!==f.lv) continue;
    out.push(b);
  }
  return out.sort((a,b)=>(b.deals-a.deals)||(a.days-b.days)).slice(0,f.limit||45);
}
function bnStats(now){
  const W=bnWeek(now);
  const weeks=[]; for(let w=Math.max(0,W-7);w<=W;w++) weeks.push(bnAdds(w));
  const catKey=(typeof D!=="undefined"&&D&&(D.catKey||D.key))||"";
  const map={food:"food",cosme:"cosme",parts:"parts",daily:"daily",car:"car",liquor:"liquor",
    apparel:"apparel",medical:"medical"};
  const ck=map[catKey]||"";
  const share=ck?(BN_CATS.find(c=>c[0]===ck)||[0,0,0])[2]:0;
  return {total:bnTotal(now),thisWeek:bnAdds(W),weeks,countries:83,
    catKey:ck,catNm:ck?(BN_CATS.find(c=>c[0]===ck)||["","）"])[1]:"",
    catCount:ck?Math.round(bnTotal(now)*share):0};
}

const ALIAS={"米国":"アメリカ","英国":"イギリス","豪州":"オーストラリア","ドバイ":"UAE","欧州":"フランス","EU":"フランス"};
const norm2=s=>String(s||"").toLowerCase().replace(/[\s　]/g,"");
function pickCountry(q){
  for(const c of CTRY) if(q.includes(c)) return ALIAS[c]||c;
  return null;
}
function pickQty(q){
  const m=q.match(/([\d][\d,]*)\s*(袋|本|個|箱|ケース|kg|pcs|units|セット)?/);
  if(!m) return null;
  const n=parseInt(m[1].replace(/,/g,""),10);
  return n>=10?{n,u:m[2]||""}:null;
}
function pickSku(q){
  const rows=D.priceRows||[];
  for(const r of rows) if(r[0]&&q.toUpperCase().includes(String(r[0]).toUpperCase())) return r;
  for(const r of rows) if(r[1]&&q.includes(String(r[1]))) return r;
  return null;
}
function pickBuyer(q){
  const all=[...(D.fb||[]).map(f=>f.b),...(D.dbr||[]).map(r=>r[0])];
  for(const b of all){ const key=String(b).split(/[ ,]/)[0];
    if(key.length>3&&norm2(q).includes(norm2(key))) return b; }
  return null;
}
const numOf=s=>{const m=String(s).match(/[\d,]+(\.\d+)?/);return m?parseFloat(m[0].replace(/,/g,"")):null;};
const curSym=s=>/¥|￥/.test(String(s))?"¥":"US$";

/* 数量に対応する価格帯を選ぶ */
function tierFor(row,cols,qty){
  const idx=[]; cols.forEach((c,i)=>{ if(i===0) return;
    const m=String(c).match(/([\d,]+)\s*〜|〜\s*([\d,]+)|([\d,]+)以上/);
    if(m) idx.push({i,lo:parseInt((m[1]||m[3]||"0").replace(/,/g,""),10)||0,
      hi:m[2]?parseInt(m[2].replace(/,/g,""),10):Infinity,label:c}); });
  if(!idx.length){ const i=cols.findIndex(c=>/価格|単価|price/i.test(String(c)));
    return i>0?{v:row[i],label:cols[i]}:null; }
  idx.sort((a,b)=>a.lo-b.lo);
  let hit=idx[0];
  for(const t of idx) if(qty>=t.lo) hit=t;
  return {v:row[hit.i],label:hit.label};
}

function detectIntent(q){
  const s=norm2(q), sc={};
  INTENTS.forEach(([k,ws])=>{ sc[k]=ws.reduce((a,w)=>a+(s.includes(norm2(w))?1:0),0); });
  if(pickBuyer(q)) sc.buyer=(sc.buyer||0)+2;
  if(pickQty(q)&&/いくら|価格|単価|見積|金額/.test(s)) sc.price+=2;
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  return best&&best[1]>0?best[0]:null;
}

function ansMissing(){

  }

function ansFallback(q){
  const s=scoreOf2();

    ・「寸法は？」「成分は？」「強みは？」「タスクの進捗は？」`,

const scoreOf2=()=>[`商品マスタ（価格 ${(D.priceRows||[]).length}行・寸法 ${(D.dimRows||[]).length}行）`,
  `${D.compTitle||"成分表"} ${(D.compRows||[]).length}項目`,`規制調査 ${Object.keys(D.regs||{}).length}か国`,
  `商談記録 ${(D.fb||[]).length}件`,`タスク ${(D.tasks||[]).length}件`].join("・");

function brain(q){
  const canned=(D.aiq||[]).find(x=>x.q===q);
  if(canned) return {a:canned.a,c:canned.c};
  const it=detectIntent(q);
  switch(it){
    case "price": return ansPrice(q);
    case "reg": return ansReg(q);
    case "docs": return ansDocs(q);
    case "logi": return ansLogi(q);
    case "spec": return ansSpec();
    case "comp": return ansComp();
    case "strength": return ansStrength();
    case "buyer": return ansBuyer(q);
    case "task": return ansTask();
    case "order": return ansOrder();
    case "missing": return ansMissing();
    case "help": return ansHelp();
    case "moq": {
      const nl=(D.lost||[]).filter(l=>/ロット|MOQ/.test(l[0])).reduce((a,l)=>a+l[1],0);
      return {a:D.moq?`最小発注数量（${tm("MOQ")}）は <b>${esc(D.moq)}</b> です。
      ${D.lead?`リードタイムは <b>${esc(D.lead)}</b>。`:""}<br><br>
      ${nl?`なお、<b style="color:var(--crit)">小ロットを求められて断った事例が ${nl}件</b>あります。
        小ロット対応の可否は、商談前に決めておくと取りこぼしを防げます。`:
        `商談では必ず聞かれる項目です。ここが即答できると1往復減らせます。`}`:
      `<b>最小発注数量が登録されていません。</b>商談で必ず聞かれる項目です。`,
      c:`根拠：商品マスタ（MOQ・リードタイム）`}; }
    case "market": return (D.aiq&&D.aiq[0])?{a:D.aiq[0].a,c:D.aiq[0].c}:
      {a:`進出希望国が未登録です。国を教えていただければ規制を調べます。`,c:"根拠：進出希望国 未登録"};
    case "lost": return (D.aiq&&D.aiq[2])?{a:D.aiq[2].a,c:D.aiq[2].c}:
      {a:`まだ失注の記録がありません。`,c:"根拠：失注 0件"};
    case "prep": return (D.aiq&&D.aiq[1])?{a:D.aiq[1].a,c:D.aiq[1].c}:
      {a:`商談記録がまだないため、想定問答を作れません。`,c:"根拠：商談記録 0件"};
    default: return ansFallback(q);
  }
}

function taskStats(){
  const all=[]; D.tasks.forEach(t=>{all.push(t);(t.kids||[]).forEach(k=>all.push({...k,pri:t.pri,who:t.who}));});
  if(!all.length) return {all:[],total:0,todo:0,doing:0,done:0,cancel:0,rate:0,overdue:0,late:0,soon:0,active:0};
  const c=s=>all.filter(t=>t.st===s).length;
  const open=t=>t.st!=="完了"&&t.st!=="中止";
  const d=s=>new Date(s+"T00:00:00");
  return {all,total:all.length,todo:c("未着手"),doing:c("対応中"),done:c("完了"),cancel:c("中止"),
    rate:Math.round(c("完了")/all.length*1000)/10,
    overdue:all.filter(t=>open(t)&&d(t.e)<TODAY).length,
    late:all.filter(t=>t.st==="未着手"&&d(t.s)<TODAY).length,
    soon:all.filter(t=>open(t)&&d(t.e)>=TODAY&&(d(t.e)-TODAY)/864e5<=7).length,
    active:all.filter(t=>t.st==="対応中"&&d(t.s)<=TODAY&&d(t.e)>=TODAY).length};
}
function donut(rate){
  const r=42,c=2*Math.PI*r,off=c*(1-rate/100);
  return `<svg width="128" height="128" viewBox="0 0 110 110" role="img" aria-label="タスク消化率 ${rate}%">
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="13"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--or)" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 55 55)"/>
    <text x="55" y="52" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-weight="700">タスク消化率</text>
    <text x="55" y="72" text-anchor="middle" font-size="24" fill="var(--ink)" font-weight="300">${rate}<tspan font-size="12">%</tspan></text></svg>`;
}
function ganttBar(t,depth){

    const kids=(t.kids||[]).filter(keep);

function valPreview(k){
  const v=TEN[k];

    if(k==="strengths") return v.slice(0,2).map(x=>esc(x[0])).join("／")+(v.length>2?` ほか${v.length-2}件`:"");
    if(k==="targets") return v.join("・");
    return `${v.length}行を取り込み`;
  }
  return esc(String(v||"").slice(0,54));
}

    sku:"",origin:"",cert:"",shelf:"",store:"",msrp:"",term:"",pay:"",pol:"",lead:"",moq:"",ctn:"",

    compTitle:"成分表・材質表",strengths:[],targets:[],nSheets:(info&&info.sheets)||1,nTables:0,unparsed:true};

async function readFile(f){
  const info={name:f.name,kb:Math.max(1,Math.round(f.size/1024)),sheets:1};
  try{
    if(/\.(xlsx|docx|pptx)$/i.test(f.name)&&f.size<12e6){
      const b=new Uint8Array(await f.arrayBuffer());
      let s=""; const CH=8192;
      for(let i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null,b.subarray(i,i+CH));
      const m=s.match(/xl\/worksheets\/sheet\d+\.xml/g);
      if(m) info.sheets=new Set(m).size;
    } else if(/\.(csv|txt)$/i.test(f.name)){ info.sheets=1; }
    else { info.sheets=3; }
  }catch(e){ info.sheets=3; }
  return info;
}
function wireUp(){
  if(FILL.on){ wireFill(); return; }
  const dz=$("#drop"), fin=$("#fin");
  const take=async f=>{ if(!f) return;
    const info=await readFile(f);
    /* アップロードは常に「実データ」または「空の環境」から。サンプル商品には流し込まない */
    if(/\.(xlsx|xlsm|csv|txt)$/i.test(f.name)){
      try{ const t=await buildTenant(f); runParseReal(t,info,f); return; }
      catch(e){ /* 解析不能 → 空の環境へ */ }
    }
    const t=blankTenant(f.name,info);
    runParseReal(t,info,f); };
  dz.addEventListener("click",()=>fin.click());
  dz.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fin.click();}});
  ["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("over");}));
  ["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("over");}));
  dz.addEventListener("drop",e=>take(e.dataTransfer.files[0]));
  fin.onchange=e=>{take(e.target.files[0]);e.target.value="";};
  document.querySelectorAll("[data-smp]").forEach(b=>b.addEventListener("click",()=>{
    const x=PRODUCTS[b.dataset.smp];
    runParse(x.key,{name:x.file,kb:{food:26,cosme:24,parts:25}[x.key],sheets:3});

}

let typing=null;
const SUG=["寸法と重量は？","MOQは？","強みを教えて","タスクの進捗は？","足りない情報は？"];
function typeOut(bb,ans,ci,c){
  const done=()=>{bb.innerHTML=ans+`<div class="ci">${ci}</div>`;c.scrollTop=1e6;};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){done();return;}
  if(typing){clearInterval(typing);typing=null;}
  /* 経過時間ベースで描画量を決める：タブが非表示でタイマーが間引かれても
     次の発火でまとめて追いつく。8秒で必ず完了させる。 */
  const tk=ans.split(/(<[^>]+>|.)/).filter(Boolean), t0=Date.now(), CPS=160;
  typing=setInterval(()=>{
    const el=Date.now()-t0, need=Math.min(tk.length,Math.max(4,Math.round(el/1000*CPS)));
    bb.innerHTML=tk.slice(0,need).join("")+'<span class="car"></span>'; c.scrollTop=1e6;
    if(need>=tk.length||el>8000){clearInterval(typing);typing=null;done();}
  },30);
}
async function askFree(q){

let WEBON=false;
const wtimeout=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),ms))]);
async function fxJob(){
  const r=await fetch("https://api.frankfurter.dev/v1/latest?base=USD&symbols=JPY",{cache:"no-store"});
  if(!r.ok) throw new Error("fx "+r.status);
  const j=await r.json();
  return [{t:"為替レート（USD/JPY）ライブ取得",src:"frankfurter.dev（欧州中央銀行の公表値）",d:j.date,live:1,
    s:`いま取得した参考レートは 1米ドル＝${j.rates.JPY}円（${j.date}公表）。実務ではこの値に銀行手数料（±1〜2円程度）が乗ります。`}];
}
async function wikiJob(q){
  const qq=String(q).replace(/[？?。、!！]/g," ")
    .replace(/(について|とは何ですか|とは|教えてください|教えて|ください|どうなってる|ですか)/g," ").trim();
  if(!qq) return [];
  const u="https://ja.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&utf8=1&srlimit=2&srprop=snippet&srsearch="+encodeURIComponent(qq);
  const r=await fetch(u,{cache:"no-store"});
  if(!r.ok) throw new Error("wiki "+r.status);
  const j=await r.json();
  return ((j.query&&j.query.search)||[]).map(x=>({t:x.title,src:"Wikipedia（日本語版）",d:"ライブ取得",live:1,
    s:String(x.snippet||"").replace(/<[^>]+>/g,"")+"…"}));
}
async function liveSearch(q){
  const s=norm2(q), jobs=[];
  if(/(為替|かわせ|レート|ドル円|円相場|円安|円高|usd|jpy)/.test(s)) jobs.push(fxJob());
  jobs.push(wikiJob(q));
  const res=await Promise.allSettled(jobs.map(j=>wtimeout(j,4500)));
  const hits=[]; let fail=0;
  res.forEach(r=>{ if(r.status==="fulfilled") hits.push(...r.value); else fail++; });
  return {hits:hits.slice(0,3),blocked:hits.length===0&&fail===res.length};
}

function searchWeb(q){
  const s=norm2(q);
  const scored=WEBDB.map(e=>{
    let sc=e.k.reduce((a,w)=>a+(s.includes(norm2(w))?1:0),0);
    if(sc&&e.cat&&typeof D!=="undefined"&&D){ if(e.cat===D.key||e.cat===(D.catKey||"")) sc+=1; else if(e.cat!==null) sc-=0.5; }
    return {e,sc};
  }).filter(x=>x.sc>=1).sort((a,b)=>b.sc-a.sc);
  return scored.slice(0,3).map(x=>x.e);
}
function webBlock(hits,mode){
  const head=mode==="live"?"🌐 Web検索の結果（ライブ）"
    :mode==="mixed"?"🌐 Web検索の結果（ライブ＋内蔵の貿易ナレッジ）"
    :"🌐 Web検索の結果（内蔵の貿易ナレッジ：この環境は外部通信が遮断されています）";
  return `<div style="margin-top:11px;border:1px solid var(--bl);border-radius:var(--r2);overflow:hidden">
   <div style="background:var(--bl-soft);padding:6px 11px;font-size:10.5px;font-weight:700;color:var(--bl)">${head}</div>
   <div style="padding:9px 12px;display:flex;flex-direction:column;gap:9px">
   ${hits.map(h=>`<div style="font-size:11.5px;line-height:1.7"><b>${h.live?"🔴 ":""}${h.t}</b><br>
     <span style="color:var(--ink-2)">${h.s}</span><br>
     <span style="font-size:10px;color:var(--ink-3)">${h.src}・${h.d}</span></div>`).join("")}
   </div></div>`;
}

  if(typeof SES==="undefined"||!SES) return false;

const __brainCore=brain;
brain=function(q){
  const r=__brainCore(q);
  if(!WEBON||!webPerm()) return r;
  return (async()=>{
    let live={hits:[],blocked:true};
    try{ live=await liveSearch(q); }catch(e){ live={hits:[],blocked:true}; }
    const snap=searchWeb(q);
    /* ライブ結果＋内蔵ナレッジを合成（重複しない範囲で最大4件） */
    const hits=[...live.hits];
    for(const h of snap){ if(hits.length>=4) break;
      if(!hits.some(x=>x.t===h.t)) hits.push(h); }
    if(!hits.length){
      r.c+=live.blocked?"／🌐 Web検索：この環境では外部通信が遮断されています":"／🌐 Web検索：該当する情報なし";
      return r;
    }
    const mode=live.hits.length?(hits.length>live.hits.length?"mixed":"live"):"snap";
    const noInternal=r.c==="該当する情報が見つかりませんでした";
    if(noInternal){
      r.a=`社内のデータには該当がありませんでしたが、<b>Webに関連する情報があります</b>。`+webBlock(hits,mode)+
        `<p style="margin-top:9px;font-size:11.5px;color:var(--ink-2)">この内容を貴社の商材に当てはめた判断が必要でしたら、
        「規制は？」「価格は？」のように聞いていただければ、社内データと突き合わせてお答えします。</p>`;
      r.c=`🌐 Web検索 ${hits.length}件（社内データに該当なし）`;
    } else {
      r.a+=webBlock(hits,mode);
      r.c+=`／🌐 Web検索 ${hits.length}件${mode==="snap"?"（外部通信が遮断のため内蔵ナレッジ）":""}`;
    }
    if(typeof logU==="function") logU("web",String(q).slice(0,42));
    return r;
  })();
};

/* 参考Web情報（ライブ検索なしのプロバイダ向け）：logic_webのライブ検索結果を文字列化 */
async function llmWebCtx(q){
  try{
    if(typeof liveSearch!=="function") return {txt:"",hits:[]};
    const live=await liveSearch(q);
    const snap=(typeof searchWeb==="function")?searchWeb(q):[];
    const hits=[...live.hits];
    for(const h of snap){ if(hits.length>=3) break; if(!hits.some(x=>x.t===h.t)) hits.push(h); }
    if(!hits.length) return {txt:"",hits:[]};
    return {txt:"\n\n=== 参考Web情報（いま取得） ===\n"+hits.map(h=>`【${h.t}】${h.s}（${h.src}・${h.d}）`).join("\n"),hits};
  }catch(e){ return {txt:"",hits:[]}; }
}

/* プロバイダ別のAPI呼び出し。戻り値 {txt,cits,model} */
async function llmAsk(q,maxTok,opts){
  if(typeof window!=="undefined"&&window.__llmMock) return window.__llmMock(q,maxTok,opts);
  opts=opts||{};
  const prov=LLM.prov, P=PROV[prov], key=llmKey(), model=llmModel(), ep=llmEp();
  const sys=opts.sys||llmSysPrompt();
  const webOK=(typeof WEBON!=="undefined"&&WEBON&&(typeof webPerm!=="function"||webPerm()))&&!opts.noWeb;
  let userQ=q, extHits=[];
  if(webOK&&!P.search){ const w=await llmWebCtx(q); userQ=q+w.txt; extHits=w.hits; }

  let req;
  if(prov==="gemini"){
    const body={system_instruction:{parts:[{text:sys}]},
      contents:[{role:"user",parts:[{text:userQ}]}],
      generationConfig:{maxOutputTokens:maxTok||900,temperature:0.2}};
    if(webOK) body.tools=[{google_search:{}}];
    req=fetch(ep+"/models/"+encodeURIComponent(model)+":generateContent",
      {method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
       body:JSON.stringify(body)});
  } else if(prov==="anthropic"){
    /* 注意：Claude 5系はtemperature非対応のため送らない。max_tokensはthinking込みなので大きめに */
    const body={model,max_tokens:Math.max(maxTok||900,700),system:sys,
      messages:[{role:"user",content:userQ}]};
    req=fetch(ep,{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify(body)});
  } else { /* perplexity / openai：OpenAI互換Chat Completions */
    const body={model,messages:[{role:"system",content:sys},{role:"user",content:userQ}]};
    if(prov==="openai"){ body.max_completion_tokens=maxTok||900; }
    else { body.max_tokens=maxTok||900; body.temperature=0.2; }
    req=fetch(ep,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify(body)});
  }
  const toMs=opts.timeout||(prov==="anthropic"?45000:25000);
  let r;
  try{
    r=await Promise.race([req,
      new Promise((_,rj)=>setTimeout(()=>rj(new Error("タイムアウト("+Math.round(toMs/1000)+"秒)")),toMs))]);
  }catch(e){
    if(/Failed to fetch|NetworkError|Load failed/i.test(String(e.message))){
      throw new Error(prov==="openai"
        ?"接続不可：OpenAIはブラウザからの直接接続を許可していません（プロキシ経由のエンドポイントが必要）"
        :"接続不可：外部通信が遮断されているか、ネットワークエラーです");
    }
    throw e;
  }
  if(!r.ok){ let msg=""; try{const e=await r.json();
      msg=(e.error&&(e.error.message||e.error.type))||e.message||"";}catch(e){}
    throw new Error("HTTP "+r.status+(msg?"："+String(msg).slice(0,110):"")); }
  const jr=await r.json();

  let txt="",cits=[],mdl=model;
  if(prov==="gemini"){
    const cand=jr.candidates&&jr.candidates[0];
    if(!cand){ const br=jr.promptFeedback&&jr.promptFeedback.blockReason;
      throw new Error(br?("回答がブロックされました："+br):"回答が返りませんでした"); }
    txt=((cand.content&&cand.content.parts)||[]).map(p=>p.text||"").join("");
    const gm=cand.groundingMetadata;
    if(gm&&gm.groundingChunks) cits=gm.groundingChunks.map(c=>c.web&&c.web.uri).filter(Boolean);
    mdl=jr.modelVersion||model;
  } else if(prov==="anthropic"){
    if(jr.stop_reason==="refusal") throw new Error("安全性の観点から回答が控えられました");
    txt=(jr.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    mdl=jr.model||model;
  } else {
    txt=(jr.choices&&jr.choices[0]&&jr.choices[0].message&&jr.choices[0].message.content)||"";
    cits=jr.citations||[];
    if((!cits||!cits.length)&&jr.search_results) cits=jr.search_results.map(x=>x.url).filter(Boolean);
    mdl=jr.model||model;
  }
  if(!txt.trim()) throw new Error("回答が空でした（モデル名やmax_tokensをご確認ください）");
  return {txt,cits:cits||[],model:mdl,extHits};
}

  return a.replace(/\n/g,"<br>");
}

/* ═══ AI追加ヒアリング：LLMが資料全体を読み、不足・曖昧な点を追加質問する ═══ */
async function llmGapAnalyze(){
  const s=scoreOf(TEN);
  const missing=s.missing.map(m=>m.n).join("、")||"（基本項目はすべて充足）";
  const sys=`あなたは総合商社で20年の経験がある貿易のプロフェッショナルです。
中小企業の輸出担当者がアップロードした商品資料（解析済みデータ）を読み、輸出実務を進める上で
「チェックリストには無いが、この商材なら確認しておくべき点」を見つけてください。
出力は必ず次のJSONだけ（前後に文章・コードフェンス禁止）：
{"insights":["資料から読み取れた重要な気づき（最大3件、各60字以内、商材固有の内容）"],
 "questions":[{"q":"担当者への追加質問（丁寧な日本語、1文、具体的に）","why":"なぜ輸出実務で必要か（30字以内）"}]}
questionsは最大3件。既に埋まっている項目の再質問や、一般論は禁止。
この商材・この資料だからこそ聞くべきこと（例：温度管理、認証の有効期限、規格の適合範囲、名称の商標、危険物該当性、シェルフライフと輸送日数の関係など）に絞ってください。`;
  const user=`=== 解析済みの商品データ ===\n${ppContext()}\n\n=== チェックリスト上の未充足項目 ===\n${missing}`;
  const r=await llmAsk(user,900,{sys,noWeb:1,timeout:60000});
  let t=r.txt.replace(/```json|```/g,"").trim();
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<=a) throw new Error("解析結果の形式が不正");
  const j=JSON.parse(t.slice(a,b+1));
  const insights=(Array.isArray(j.insights)?j.insights:[]).map(x=>String(x).slice(0,120)).filter(Boolean).slice(0,3);
  const questions=(Array.isArray(j.questions)?j.questions:[]).map(x=>({
    q:String(x&&x.q||"").slice(0,180),why:String(x&&x.why||"").slice(0,90)})).filter(x=>x.q).slice(0,3);
  return {insights,questions};
}
function llmExtraHook(){

function llmExtraStart(){
  FILL.cur=null; FILL.xq="loading"; FILL.xi=0;
  fillSay("ai",`基本項目のヒアリングはここまでです。<br>
    ここからは接続中のAI（<b>${esc(PROV[LLM.prov].nm)}</b>）が<b>資料全体をもう一度読み直して</b>、
    この商材だからこそ確認すべき点がないか分析しています…<span class="p bl">数秒〜十数秒かかります</span>`);
  render();
  llmGapAnalyze().then(res=>{
    TEN.aiNotes=res.insights;
    FILL.xq=res.questions;
    if(typeof syncTenant==="function") syncTenant();
    if(typeof saveTen==="function") saveTen();
    let ins=res.insights.length
      ?`資料を読み直しました。<b>AIが気づいた点：</b><br>${res.insights.map(x=>"・"+esc(x)).join("<br>")}<br><br>`
      :`資料を読み直しました。<br>`;
    if(!res.questions.length){
      fillSay("ai",ins+`追加で確認すべき点は見つかりませんでした。<b>資料の内容は明確です。</b>`);
      llmExtraFinish(); return;
    }
    fillSay("ai",ins+`この商材に固有の確認事項として、<b>あと${res.questions.length}問だけ</b>伺わせてください。
      回答はAI商社マンの答えの精度に直結します。`);
    llmExtraNext();
  }).catch(e=>{
    FILL.xq=[];
    fillSay("ai",`（AIエンジンでの追加分析は接続できずスキップしました：${esc(String(e.message)).slice(0,70)}）`);
    llmExtraFinish();
  });
}
function llmExtraNext(){
  const qs=FILL.xq||[];
  if(FILL.xi>=qs.length){ llmExtraFinish(); return; }
  const x=qs[FILL.xi];
  FILL.cur={x:1,k:"_x"+FILL.xi,n:"AI追加確認",q:esc(x.q),ex:"",use:esc(x.why||"AI商社マンの回答精度向上"),w:0,qPlain:x.q};
  fillSay("ai",`<span class="p bl">🤖 AI追加ヒアリング ${FILL.xi+1}/${qs.length}</span><br>
    <b>${esc(x.q)}</b>
    <div class="ci">${esc(x.why||"AI商社マンの回答精度向上")}のために伺っています。分からなければ「不明」でも構いません。</div>`,{ask:FILL.cur});
  render();
}

const __fillAnsB4x=fillAnswer;

    asave(); admIssued=code; renderAdmin(); scrollTo({top:0});
  };
  const nc=$("#ncopy"); if(nc) nc.onclick=()=>copyTxt(admIssued);
  well.querySelectorAll("[data-tgl]").forEach(b=>b.onclick=()=>{
    const a=findAcct(b.dataset.tgl); if(!a) return;
    a.st=a.st==="active"?"disabled":"active";
    if(a.st==="active"&&a.expires<NOW()) a.expires=NOW()+14*DAY;
    asave(); renderAdmin();
    toast(a.st==="active"?a.code+" を有効化しました":a.code+" を無効化しました");
  });
  well.querySelectorAll("[data-det]").forEach(b=>b.onclick=()=>admDetail(b.dataset.det));
}
function admDetail(code){
  const a=findAcct(code); if(!a) return;
  const u=a.usage, sc=Object.entries(u.screens||{}).sort((x,y)=>y[1]-x[1]).slice(0,8);
  const mx=Math.max(1,...sc.map(x=>x[1]));
  const IC={login:"🔑",upload:"📄",ai:"💬",web:"🌐",fill:"✍️",screen:"🧭"};
  openDW(`<h3>${esc(a.co)}</h3>
   <p class="nn" style="margin-bottom:10px"><span class="acode">${a.code}</span>
     ${a.st==="active"?'<span class="p hi">有効</span>':'<span class="p no">無効</span>'}
     <span class="p ${a.web!==false?"on":"lo"}">🌐 ${a.web!==false?"許可":"停止"}</span></p>
   <dl style="margin:0">${[["発行日",fdate2(a.created)],
     ["有効期限",fdate2(a.expires)+(a.expires>NOW()?`（残り${dleft(a)}日）`:"（期限切れ）")],
     ["ご担当",a.who||"—"],["初回利用",u.first?fdate2(u.first):"未利用"],
     ["最終利用",u.lastActive?fdate2(u.lastActive):"未利用"]]
     .map(([k,v])=>`<div class="fld"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
   <div class="g4" style="margin-top:12px;gap:7px">
     ${[["ログイン",u.logins],["アップロード",u.uploads],["AI質問",u.aiQ],["🌐Web検索",u.webQ]]
       .map(([l,v])=>`<div style="padding:7px 9px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface-2)">
         <p class="lbl" style="font-size:9px">${l}</p><div class="n" style="font-size:17px;font-weight:300">${v}</div></div>`).join("")}
   </div>
   ${sc.length?`<p class="lbl" style="margin-top:13px">よく見ている画面</p>
     <div style="margin-top:6px;display:flex;flex-direction:column;gap:5px">
     ${sc.map(([k,v])=>`<div style="display:grid;grid-template-columns:112px 1fr 22px;gap:7px;align-items:center;font-size:11px">
       <span>${SCN[k]||k}</span><span class="mt" style="margin:0"><i style="width:${v/mx*100}%"></i></span>
       <span class="n" style="text-align:right;color:var(--ink-3)">${v}</span></div>`).join("")}</div>`:""}
   ${u.events&&u.events.length?`<p class="lbl" style="margin-top:13px">最近の利用（新しい順）</p>
     <div class="tl" style="margin-top:7px">${u.events.slice(0,10).map(([t2,ev,d])=>
       `<div class="ti"><time>${fdate2(t2)}</time>${IC[ev]||""} ${esc(d||ev)}</div>`).join("")}</div>`:""}
   <div class="rw" style="margin-top:14px">
     <button class="btn ${a.st==="active"?"g":""}" id="dw-tgl">${a.st==="active"?"無効化する":"有効化する"}</button>
     <button class="btn g" id="dw-web">🌐 ${a.web!==false?"Web検索を停止":"Web検索を許可"}</button>
     <button class="btn g" id="dw-ext">期限を +14日</button>
     <button class="btn g" id="dw-copy">コードをコピー</button>
     <button class="btn g" id="dw-del" style="color:var(--crit);border-color:var(--crit)">削除</button></div>`);
  $("#dw-tgl").onclick=()=>{a.st=a.st==="active"?"disabled":"active";
    if(a.st==="active"&&a.expires<NOW())a.expires=NOW()+14*DAY;
    asave();closeDW();renderAdmin();toast(a.st==="active"?"有効化しました":"無効化しました");};
  $("#dw-web").onclick=()=>{a.web=!(a.web!==false);asave();closeDW();renderAdmin();
    toast(a.web?"Web検索を許可しました":"Web検索を停止しました");};
  $("#dw-ext").onclick=()=>{a.expires=Math.max(a.expires,NOW())+14*DAY;asave();closeDW();renderAdmin();toast("期限を14日延長しました");};
  $("#dw-copy").onclick=()=>copyTxt(a.code);
  $("#dw-del").onclick=()=>{if(confirm(a.code+" を削除しますか？利用状況も消えます。")){
    ADB.accounts=ADB.accounts.filter(x=>x.code!==a.code);asave();closeDW();renderAdmin();toast("削除しました");}};
}
