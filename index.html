/* ══ 出荷案件のマルチ化：検索から開始・最大4件・自由入力からの自動立ち上げ ══ */
function shipEnsure(){
  if(!D||!D.ship) return;
  if(!SHIPS||SHIPS._pid!==PID){
    SHIPS=[{ship:D.ship,step:shipStep||0,qa:SHIPQA||[],seed:1,mods:{},open:1,at:1}];
    SHIPS._seq=1;
    SHIPS._pid=PID; SHIPA=0;
  }
  if(!SHIPS[SHIPA]) SHIPA=0;
  if(SHIPS[0]&&SHIPS[0].seed&&SHIPA===0&&!SHIPS[0].custom) SHIPS[0].ship=D.ship;
  const c=SHIPS[SHIPA];
  c.step=shipStep; c.qa=SHIPQA;
  if(c.custom) D.ship=c.ship;
}
function shipShort(b){ return String(b||"").replace(/ (Ltd|Co|Inc|Pte|LLC|GmbH|JSC|SARL|DMCC|Sdn)\.?.*/,"").slice(0,14); }
function shipCaseNew(o){
  o=o||{};
  const cty=(typeof cnorm==="function"?cnorm(o.cty||""):(o.cty||""))||"香港";
  const base=SHIPS&&SHIPS[0]?SHIPS[0].ship:D.ship;
  const ship=JSON.parse(JSON.stringify(base));
  const cc=(typeof BN_CC!=="undefined"&&BN_CC[cty])||"XX";
  ship.no=cc+"-"+TODAYS.replace(/-/g,"").slice(4)+"-0"+((SHIPS?SHIPS.length:1)+1);
  ship.country=cty;
  ship.buyer=o.buyer||("（想定）"+cty+"の輸入商社");
  const d=new Date(TODAYS+"T00:00:00"); d.setDate(d.getDate()+14+((SHIPS?SHIPS.length:1)*2));
  ship.want=d.toISOString().slice(0,10);
  return {ship,step:0,qa:[],custom:1,src:o.src||"",mods:{},open:1,at:(SHIPS?(SHIPS._seq=(SHIPS._seq||1)+1):1)};
}
function shipSlot(keep){
  /* タブ表示は4件まで：あふれたら最も使っていない案件をタブから外す（データは保持） */
  const open=SHIPS.map((c,i)=>({c,i})).filter(x=>x.c.open!==false);
  if(open.length<=4) return;
  const lru=open.filter(x=>x.i!==keep&&x.i!==SHIPA).sort((a,b)=>(a.c.at||0)-(b.c.at||0))[0];
  if(lru){ lru.c.open=false;
    toast("タブが4件のため "+lru.c.ship.no+" をタブから外しました（案件は保存済み・🔍検索から再開できます）"); }
}
function shipActivate(i){
  if(!SHIPS||!SHIPS[i]) return;
  const cur2=SHIPS[SHIPA];
  if(cur2){ cur2.step=shipStep; cur2.qa=SHIPQA; }
  SHIPA=i;
  const c=SHIPS[i];
  if(c.open===false) c.open=1;
  c.at=(SHIPS._seq=(SHIPS._seq||1)+1);
  shipSlot(i);
  shipStep=c.step||0; SHIPQA=c.qa||[];
  if(c.custom) D.ship=c.ship; else if(SHIPS[0]&&SHIPS[0].seed) D.ship=SHIPS[0].ship;
  render();
}
function shipCloseCase(i){
  if(!SHIPS||i===0||!SHIPS[i]) return;
  SHIPS[i].open=false;
  const no=SHIPS[i].ship.no;
  if(SHIPA===i){
    const first=SHIPS.findIndex(c=>c.open!==false);
    shipActivate(first>=0?first:0);
  } else render();
  toast("案件 "+no+" をタブから外しました（案件は保存済み・🔍検索からいつでも再開できます）");
}
function shipStartCase(o){
  shipEnsure();
  const c=shipCaseNew(o);
  SHIPS.push(c);
  closeDW();
  shipActivate(SHIPS.length-1);
  toast("案件 "+c.ship.no+"（"+c.ship.country+"）を開始しました");
  if(typeof logU==="function") logU("ai","出荷案件開始:"+c.ship.country);
  return true;
}
/* 自由入力からの案件立ち上げ：「◯◯の受注、出荷まで進めておいて」等 */
function shipIntent(q){
  const s2=String(q||"");
  if(!/(受注|出荷|案件)/.test(s2)||!/(進めて|進めておいて|まかせ|任せ|お願い|開始|立ち上げ)/.test(s2)) return false;
  let cty=(typeof bnFindCty==="function"?bnFindCty(s2):"");
  if(!cty&&/韓国/.test(s2)) cty="韓国";
  if(!cty) return false;
  cty=typeof cnorm==="function"?cnorm(cty):cty;
  if(SHIPS&&SHIPS.some(c=>c.ship.country===cty&&!c.done)){
    const i=SHIPS.findIndex(c=>c.ship.country===cty);
    shipActivate(i); toast(cty+"の案件タブに切り替えました"); return true;
  }
  const m=s2.match(/(?:向けの|の)([^、。\s]{2,14}?(?:商社|バイヤー|チェーン|ディストリビューター|小売|卸|プラットフォーム))/);
  return shipStartCase({cty,buyer:m?("（想定）"+cty+"の"+m[1].replace(/^輸入/,"輸入")):"",src:"chat"});
}

function shipNewList(q){
  q=String(q||"").trim();
  const hit=v=>!q||String(v||"").toLowerCase().includes(q.toLowerCase());
  const row=(t,sub,attrs)=>`<div class="rw" style="justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px">

    `<div class="rw" style="justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--or);border-radius:8px;margin-bottom:6px;background:var(--or-soft)">

      <button class="btn g" style="flex:none;padding:5px 11px;font-size:11px" data-shiptab2="${x.i}">開く</button></div>`).join("");
  /* 商談記録から */
  const fb=(D.fb||[]).filter(f=>f&&!Array.isArray(f)&&f.b&&(hit(f.b)||hit(f.c)||hit(f.ch)||hit(f.st))).slice(0,8);
  if(fb.length) h+=`<p class="lbl" style="margin-top:8px">商談記録から</p>`+fb.map(f=>
    row(`${esc(f.b)} <span class="p lo" style="font-size:9px">${esc(f.c||"")}</span>`,
        `${esc(f.d||"")}／${esc(f.ch||"")}／${esc(f.st||"")}`,
        `data-shipgo="fb" data-cty="${esc(f.c||"")}" data-buyer="${esc(f.b)}"`)).join("");

        <span style="margin-left:auto;font-weight:600;color:var(--bl);font-size:10px">→ 右の手続きパネルに表示中</span></div></div>`);
  }
  SHIPQA.forEach(x=>{ pushTo(c,"u",esc(x.q));
    const b=pushTo(c,"a",x.a); b.insertAdjacentHTML("beforeend",`<div class="ci">${x.ci}</div>`); });
  c.scrollTop=c.scrollHeight;
  const sqEl=$("#sq");
  const sqGrow=()=>{sqEl.style.height="auto";sqEl.style.height=Math.min(170,Math.max(80,sqEl.scrollHeight))+"px";};
  sqEl.addEventListener("input",sqGrow);
  const sgo=()=>{const v=(sqEl.value||"").trim(); if(!v) return;
    sqEl.value=""; sqGrow();
    if(typeof shipEditIntent==="function"&&shipEditIntent(v)) return;   /* 「単価を…に変更して」→編集（ロック時は説明） */
    if(typeof shipIntent==="function"&&shipIntent(v)) return;   /* 「◯◯の受注、出荷まで進めて」→案件を立ち上げ */
    askShip(v); };
  $("#sqgo").onclick=sgo;
  sqEl.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sgo();}};
  if(typeof mdBarBind==="function") mdBarBind();
  document.querySelectorAll("[data-sq]").forEach(b=>b.onclick=()=>askShip(b.dataset.sq));
  document.querySelectorAll("[data-shiptab]").forEach(b=>b.onclick=()=>shipActivate(+b.dataset.shiptab));
  document.querySelectorAll("[data-shipx]").forEach(b=>b.onclick=e=>{e.stopPropagation();shipCloseCase(+b.dataset.shipx);});
  const sq2=$("#shipsq"), sqo=$("#shipsqout");
  if(sq2&&sqo){
    const drawq=()=>{
      const q=(sq2.value||"").trim().toLowerCase();
      if(!q){ sqo.style.display="none"; sqo.innerHTML=""; return; }
      const hits=SHIPS.map((c2,i)=>({c2,i})).filter(x=>
        (x.c2.ship.no+" "+x.c2.ship.country+" "+x.c2.ship.buyer).toLowerCase().includes(q)).slice(0,12);
      sqo.innerHTML=hits.length?hits.map(({c2,i})=>
        `<div class="rw" data-shipfind="${i}" style="justify-content:space-between;gap:6px;padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--line-2);font-size:11.5px">

        :`<div style="padding:9px 11px;font-size:11.5px;color:var(--ink-3)">該当する案件がありません。「＋ 新しい案件」から開始できます。</div>`;
      sqo.style.display="block";

        sq2.value=""; sqo.style.display="none"; shipActivate(+x.dataset.shipfind); });
    };
    sq2.addEventListener("input",drawq);
    sq2.addEventListener("focus",drawq);
    sq2.addEventListener("blur",()=>setTimeout(()=>{ if(sqo) sqo.style.display="none"; },180));
  }
  
  const nb=$("#sbtn");
  if(shipStep<ST.length-1){
    nb.innerHTML=`<button class="btn" id="snext">${ST[shipStep+1].t} へ進む →</button>
      <span style="font-size:11px;color:var(--ink-3);align-self:center">ステップ ${shipStep+2} / ${ST.length}</span>`;
    $("#snext").addEventListener("click",()=>{shipStep++;render();});

    nb.innerHTML=`<span class="p hi" style="font-size:11.5px;padding:6px 11px">✓ 出荷手続き 完了</span>
      <button class="btn g" onclick="go('ops')">できた書類を見る</button>
      <button class="btn g" onclick="shipStep=0;SHIPQA=[];render()">最初から</button>`;
  }
}

/* (3) 議事録（Zoom・Meet等）→ AIが商談記録の項目へ整理して反映 */
async function dealFromMinutes(text,att){
  const st=$("#dfMinSt"); const say=m=>{ if(st) st.innerHTML=m; };
  if(!text&&!att){ say("議事録を貼り付けるか、ファイルを添付してください"); return; }
  if(!(typeof ppReady==="function"&&ppReady())){
    if(text){ const n=$("#dfNote"); if(n&&!n.value) n.value=text.slice(0,800);
      say("AIエンジン未接続のため自動整理は使えません。<b>議事録は背景メモに転記しました</b>——他の項目のご入力をお願いします（接続すると全自動になります）。"); }
    else say("AIエンジン未接続のため、ファイルの自動整理は使えません（管理コンソールで接続できます）。");
    return;
  }
  say('<span class="spin"></span> AIが議事録を整理しています…（10〜30秒）');
  try{
    const r=await llmAsk(
'次の商談議事録から、商談記録をJSONのみで抽出してください：\n'+
'{"d":"商談日 YYYY-MM-DD（不明なら空）","b":"バイヤー会社名","c":"国（日本語）",'+
'"ch":"展示会|オンライン商談|メール・DM|紹介|バイヤーDB経由|その他",'+
'"spec":"先方の要望・要求スペック","price":"希望価格","lot":"数量","term":"FOB|CIF|DDP|EXW|",'+
'"react":"高|中|低","st":"商談中|見積提示|サンプル発送|受注|失注|保留","why":"断られた理由（失注時のみ）",'+
'"owner":"当社側の出席者・担当者名（不明なら空）","note":"背景メモ（3行以内の要約。決定事項・次のアクションを含める）"}\n'+
'議事録に書かれていないことは空にする（創作禁止）。オンライン会議なら ch は「オンライン商談」。\n'+
(text?("=== 議事録 ===\n"+text.slice(0,18000)):"（添付ファイルが議事録です）"),
      900,{noWeb:1,timeout:90000,att:att||undefined});
    const j=JSON.parse(r.txt.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/)[0]);
    const set=(id,v)=>{ const e=$("#"+id); if(e&&v&&String(v).trim()) e.value=String(v).trim(); };
    if(/^\d{4}-\d{2}-\d{2}$/.test(j.d||"")) set("dfD",j.d);
    set("dfB",j.b); set("dfC",typeof cnorm==="function"?cnorm(j.c||""):j.c);
    if(j.ch){ const e=$("#dfCh"); if(e&&[...e.options].some(o=>o.value===j.ch)) e.value=j.ch; }
    set("dfSpec",j.spec); set("dfP",j.price); set("dfL",j.lot);
    if(j.term){ const e=$("#dfT"); if(e&&[...e.options].some(o=>o.value===j.term)) e.value=j.term; }
    if(/^(高|中|低)$/.test(j.react||"")){ const b2=document.querySelector('[data-react="'+j.react+'"]'); if(b2) b2.click(); }
    if(j.st){ const e=$("#dfSt"); if(e&&[...e.options].some(o=>o.value===j.st)){ e.value=j.st; if(e.onchange) e.onchange(); } }
    set("dfWhy",j.why); set("dfOwner",j.owner); set("dfNote",j.note);
    say('✓ 反映しました。<b>内容をご確認・修正のうえ「記録する」</b>を押してください（議事録に無い項目は空欄のままです）。');
    if(typeof logU==="function") logU("ai","議事録から商談記録を抽出");
  }catch(e){ say("整理できませんでした："+esc(String(e.message)).slice(0,60)); }
}
function dealAdviseLocal(rec){
  const tips=[];
  if(!rec.price) tips.push("希望価格が入ると、値付けと値引き余地の学習に使えます（次回でOK）");
  if(!rec.lot) tips.push("数量が分かると「その数量ならいくら」をAIが即答できるようになります");
  if(rec.st==="失注"&&!rec.why) tips.push("<b>断られた理由</b>は最重要データです。ひと言でも残してください");

let typing=null;
const SUG=["寸法と重量は？","MOQは？","強みを教えて","タスクの進捗は？","足りない情報は？"];
function typeOut(bb,ans,ci,c){
  const done=()=>{bb.innerHTML=ans+`<div class="ci">${ci}</div>`;c.scrollTop=1e6;};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){done();return;}
  if(typing){clearInterval(typing);typing=null;}
  /* 経過時間ベースで描画量を決める：タブが非表示でタイマーが間引かれても
     次の発火でまとめて追いつく。8秒で必ず完了させる。 */
  const tk=ans.split(/(<[^>]+>|.)/).filter(Boolean), t0=Date.now(), CPS=160;
  typing=setInterval(()=>{
    const el=Date.now()-t0, need=Math.min(tk.length,Math.max(4,Math.round(el/1000*CPS)));
    bb.innerHTML=tk.slice(0,need).join("")+'<span class="car"></span>'; c.scrollTop=1e6;
    if(need>=tk.length||el>8000){clearInterval(typing);typing=null;done();}
  },30);
}

/* ══ 地図のズーム/パン（状態は表示中ずっと維持） ══ */
let MAPZ={s:1,x:0,y:0};
function mapApply(){
  const m=$("#mapin"); if(!m) return;
  MAPZ.s=Math.min(6,Math.max(1,MAPZ.s));
  const w=$("#mapw"); const r=w?w.getBoundingClientRect():{width:1,height:1};
  const maxX=r.width*(MAPZ.s-1), maxY=r.height*(MAPZ.s-1);
  MAPZ.x=Math.min(0,Math.max(-maxX,MAPZ.x));
  MAPZ.y=Math.min(0,Math.max(-maxY,MAPZ.y));
  m.style.transform=`translate(${MAPZ.x}px,${MAPZ.y}px) scale(${MAPZ.s})`;
  m.classList.toggle("showcn",MAPZ.s>=1.9);   /* 拡大すると各国の国名が表示される */
  /* ピンとラベルはズームに合わせて等倍を維持（間隔だけ広がる） */
  m.querySelectorAll(".pin").forEach(p=>{ p.style.transform=`translate(-50%,-50%) scale(${1/MAPZ.s})`; });
}
function mapZoom(f,cx,cy){
  const w=$("#mapw"); if(!w) return;
  const r=w.getBoundingClientRect();
  cx=cx===undefined?r.width/2:cx; cy=cy===undefined?r.height/2:cy;
  const s0=MAPZ.s, s1=Math.min(6,Math.max(1,s0*f));
  /* カーソル位置を保ったままズーム */
  MAPZ.x=cx-(cx-MAPZ.x)*(s1/s0);
  MAPZ.y=cy-(cy-MAPZ.y)*(s1/s0);
  MAPZ.s=s1; mapApply();
}
function mapBind(){
  const w=$("#mapw"); if(!w||w._mz) return; w._mz=1;
  mapApply();
  document.querySelectorAll("[data-mz]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(b.dataset.mz==="in") mapZoom(1.6);
    else if(b.dataset.mz==="out") mapZoom(1/1.6);
    else { MAPZ={s:1,x:0,y:0}; mapApply(); }
  });
  w.addEventListener("wheel",e=>{ e.preventDefault();
    const r=w.getBoundingClientRect();
    mapZoom(e.deltaY<0?1.35:1/1.35,e.clientX-r.left,e.clientY-r.top); },{passive:false});
  let drag=false,sx=0,sy=0,bx=0,by=0;
  const mv=e=>{ if(!drag) return;
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4) window.__mapDragged=true;
    MAPZ.x=bx+(e.clientX-sx); MAPZ.y=by+(e.clientY-sy); mapApply(); };
  const end=()=>{ if(!drag) return; drag=false; w.style.cursor="grab";
    window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",end);
    setTimeout(()=>{ window.__mapDragged=false; },120); };
  w.addEventListener("pointerdown",e=>{
    if(e.target.closest("[data-mz]")) return;
    if(window.__mapPick) return;   /* 位置設定モード中はドラッグしない */
    drag=true; sx=e.clientX; sy=e.clientY; bx=MAPZ.x; by=MAPZ.y;
    window.__mapDragged=false; w.style.cursor="grabbing";
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",end);
  });
  /* 位置設定モード：クリックで座標を取得（ズームは自動リセット済み） */
  w.addEventListener("click",e=>{
    if(!window.__mapPick||window.__mapDragged) return;
    const r=w.getBoundingClientRect();
    const x=Math.round((e.clientX-r.left)/r.width*1000)/10;
    const y=Math.round((e.clientY-r.top)/r.height*1000)/10;
    const cb=window.__mapPick; window.__mapPick=null;
    cb(x,y);
  });
}

function dmThreads(){ if(typeof TEN!=="undefined"&&TEN){ TEN.dmThreads=TEN.dmThreads||{}; return TEN.dmThreads; } return {}; }
function dmActiveThreads(){ return Object.values(dmThreads()).filter(t=>t.msgs&&t.msgs.length); }
function dmUnreadSum(){ return dmActiveThreads().reduce((a,t)=>a+(t.unread||0),0); }

  TEN.dmNotifs.unshift({t:dmNow(),txt:`${th.cty}の${th.biz}（ID ${th.id}）から返信が届きました`,id:th.id,cty:th.cty,biz:th.biz});

async function dmReplyText(th){
  const last=th.msgs.filter(m=>m.w==="me").slice(-1)[0];
  if(typeof ppReady==="function"&&ppReady()){
    try{
      const hist=th.msgs.slice(-6).map(m=>(m.w==="me"?"[Seller] ":"[Buyer] ")+String(m.body).slice(0,500)).join("\n---\n");
      const r=await llmAsk(
`あなたは${th.cty}の${th.biz}のバイヤー担当者です。日本のサプライヤーからの下記メールに、バイヤーとして自然な返信を書いてください。
言語：${th.lang||"English"}／長さ：80語程度／トーン：ビジネスライクだが前向き。
必ず「関心のポイント1つ」と「次に知りたい具体的な質問1〜2個」（価格・MOQ・サンプル・認証・納期など）を含める。署名は "Purchasing Team (ID ${th.id})"。
=== これまでのやり取り ===
${hist}`,600,{noWeb:1,timeout:60000});
      return r.txt.trim();
    }catch(e){}
  }
  const v=(th.msgs.filter(m=>m.w==="by").length%2===1)
    ?`Thank you for your message. Your product looks interesting for our market.\nCould you share your best FOB price for a first order, and the MOQ?\nAlso, do you have an English label available?\n\nBest regards,\nPurchasing Team (ID ${th.id})`
    :`Thanks for the details. We would like to evaluate samples.\nPlease advise sample cost and lead time to ${th.cty}. Do you have relevant certificates for import?\n\nBest regards,\nPurchasing Team (ID ${th.id})`;
  return v;
}
function dmReplyArrive(id){
  const th=dmThreads()[id]; if(!th||!th.wait) return;
  th.wait=0;

    th.unread=(th.unread||0)+1;
    dmNotify(th);

    updateBell();
    toast(`📨 ${th.cty}の${th.biz}から返信が届きました（通知🔔からも開けます）`);

       &&$("#dw").dataset.open==="true"){ openDMThread(id); }
    if(cur==="db") render();
  });
}

/* ── AIサイドバーの拡大・リサイズ（幅は保存され次回も同じ広さで開く） ── */
let DWW=0; try{ DWW=+(localStorage.getItem("bc20_dww")||0)||0; }catch(e){}
function dwMob(){ return window.matchMedia&&matchMedia("(max-width:820px)").matches; }
function dwIsWide(){ return DWW>560; }
function dwApplyW(){
  const pn=$("#pn"); if(!pn) return;
  if(dwMob()){ pn.style.width=""; return; }
  pn.style.width=DWW?Math.min(DWW,Math.round(innerWidth*0.94))+"px":"";
  const b=$("#dwmax"); if(b) b.textContent=dwIsWide()?"⇤ 標準幅に戻す":"⛶ 拡大";
}
function dwSetW(px){
  DWW=px?Math.round(px):0;
  try{ localStorage.setItem("bc20_dww",String(DWW)); }catch(e){}
  dwApplyW();
}
function dwToggleMax(){ dwSetW(dwIsWide()?0:Math.min(920,Math.round(innerWidth*0.72))); }
function dwChrome(){
  const pn=$("#pn"); if(!pn) return;
  /* ⛶拡大／⇤標準ボタン：どのドロワーにも統一で付ける（AIに質問と同じ操作感） */
  if(!pn.querySelector("#dwmax")){
    const mb=document.createElement("button");
    mb.className="btn g dwmaxb"; mb.id="dwmax"; mb.title="パネルを拡大／標準幅に戻す（左端をドラッグでも調整できます）";
    mb.style.cssText="position:absolute;top:10px;right:44px;padding:4px 11px;font-size:11px;z-index:5";
    mb.onclick=dwToggleMax;
    pn.prepend(mb);
  }
  if(!pn.querySelector(".dwgrip")){
    const g=document.createElement("div"); g.className="dwgrip"; g.title="ドラッグで幅を調整";
    pn.prepend(g);
    let sx=0,sw=0,drag=false;
    const mv=e=>{ if(!drag) return;
      pn.style.width=Math.min(Math.max(370,sw+(sx-e.clientX)),Math.round(innerWidth*0.94))+"px"; };
    const end=()=>{ if(!drag) return; drag=false; g.classList.remove("on");
      window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",end);
      window.removeEventListener("pointercancel",end);
      /* 幅の実測は transition:none のまま行う（先に戻すと遷移開始値＝旧幅を保存してしまう） */
      const w=pn.getBoundingClientRect().width;
      pn.style.transition=""; dwSetW(w); };
    g.addEventListener("pointerdown",e=>{ if(dwMob()) return;
      drag=true; sx=e.clientX; sw=pn.getBoundingClientRect().width;
      pn.style.transition="none"; g.classList.add("on");
      /* グリップ外へ出ても追従できるようwindowで捕捉（ポインタキャプチャ不要＝実機・タッチとも安定） */
      window.addEventListener("pointermove",mv); window.addEventListener("pointerup",end);
      window.addEventListener("pointercancel",end);
      e.preventDefault(); });
  }
  dwApplyW();
}

/* ③ 表示の洗練：長い説明文（.nn/.cando）と環境注記（#ft）を1行に折りたたみ、クリックで全文。
   文言・機能は一切変えない（初心者がまず全体を見渡せるようにするための表示圧縮） */
function refineText(){
  const clamp=(el,always)=>{
    if(!el||el._nnc) return;
    if(el.querySelector&&el.querySelector("button,input,select,textarea,label")) return;
    const len=(el.textContent||"").trim().length;
    const lim=always?0:(el.classList.contains("cando")?70:95);
    if(len<=lim) return;
    el._nnc=1; el.classList.add("nnc");
    el.title="クリックで全文を表示";
    el.addEventListener("click",e=>{
      if(e.target.closest("a,button,input,select,textarea,label")) return;
      el.classList.toggle("open");
    });
  };
  document.querySelectorAll("#well .nn,#well .cando").forEach(el=>clamp(el,false));
  clamp(document.querySelector("#ft"),true);
}

/* ── 日付・金額パーサ ── */
function dashDate(s){
  s=String(s||"").trim(); if(!s) return "";
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=s.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})月(\d{1,2})日/);
  if(m) return `2026-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
  return "";
}
function amtParse(s){
  s=String(s||"").trim();
  const mul=t=>t==="M"?1e6:t==="K"?1e3:t==="万"?1e4:t==="億"?1e8:1;
  let m=s.match(/(?:US\$|USD\s?\$?)\s?([\d,]+(?:\.\d+)?)\s*([MK万億])?/i)||(/^\$/.test(s)?s.match(/\$\s?([\d,]+(?:\.\d+)?)\s*([MK万億])?/):null);
  if(m) return {cur:"USD",v:(parseFloat(m[1].replace(/,/g,""))||0)*mul(m[2]||"")};
  m=s.match(/[¥￥]\s?([\d,]+(?:\.\d+)?)\s*([MK万億])?/);
  if(m) return {cur:"JPY",v:(parseFloat(m[1].replace(/,/g,""))||0)*mul(m[2]||"")};
  m=s.match(/([\d,]+(?:\.\d+)?)/); return m?{cur:"",v:parseFloat(m[1].replace(/,/g,""))||0}:{cur:"",v:0};
}
function docRateOf(S){
  const ex=(S&&S.docRows&&S.docRows.ex)||[];
  for(const r of ex){ const line=(r||[]).join(" ");
    if(/レート|exchange\s*rate/i.test(line)){ const m=line.match(/(\d{2,3}(?:\.\d{1,2})?)/); if(m){ const v=parseFloat(m[1]); if(v>80&&v<400) return v; } } }
  return null;
}
function fmtJPY(n){ return "¥"+Math.round(n).toLocaleString(); }
function fmtUSD(n){ return "US$"+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:n>=1000?0:2}); }

/* ── 受注（＝Invoice書類の金額と同一ソース：D.ship / 出荷案件） ── */
function dashOrders(us){
  const out=[],seen={};
  const push=(S,u,src)=>{
    if(!S||!S.no||seen[S.no]) return; seen[S.no]=1;
    const a=amtParse(S.total), dr=docRateOf(S);
    const etd=(S.sched||[]).find(r=>/出港|出発|ETD/.test(String(r[1]||"")));
    out.push({no:S.no,buyer:S.buyer||"—",cty:S.country||"—",item:u.item,co:u.co,qty:S.qty||"—",
      unit:S.unitPrice||"—",total:S.total||"—",a,docRate:dr,
      dISO:dashDate(S.want)||dashDate(etd&&etd[0])||"",ref:u.ref,src});
  };
  us.forEach(u=>{ const k=u.D&&u.D.kpi; if(u.D&&u.D.ship&&k&&k.won) push(u.D.ship,u,"base"); });
  if(typeof SHIPS!=="undefined"&&SHIPS&&SHIPS.length){
    const au=us.find(x=>x.act);
    if(au) SHIPS.forEach(cs=>{ if(cs&&cs.ship) push(cs.ship,au,"case"); });
  }
  return out;
}
function dashMoney(orders){
  const r=dashRate(); let jpy=0,usd=0,mixed=0;
  orders.forEach(o=>{ const rt=o.docRate||r.v;
    if(o.a.cur==="USD"){ usd+=o.a.v; jpy+=o.a.v*rt; }
    else if(o.a.cur==="JPY"){ jpy+=o.a.v; usd+=o.a.v/rt; }
    else if(o.a.v){ mixed++; }
    if(o.docRate) o._rSrc="書類記載レート "+o.docRate; });
  return {jpy,usd,mixed,rate:r};
}

/* ── 集計（期間指定時は日付を持つデータ＝商談記録・受注ベース） ── */
function dashAgg(us){
  const per=!!(DASH.from||DASH.to);
  const ok=d=>{ if(!per) return true; if(!d) return false;
    return (!DASH.from||d>=DASH.from)&&(!DASH.to||d<=DASH.to); };
  const fb=[];
  us.forEach(u=>(u.D.fb||[]).forEach((r,fi)=>{ if(ok(dashDate(r.d))) fb.push({...r,_ref:u.ref,_fi:fi,_item:u.item,_co:u.co}); }));
  let orders=dashOrders(us).filter(o=>!per||ok(o.dISO));
  const K={fbDone:0,fbGoal:0,buyers:0,hot:0,countries:0,quotes:0,quoteAmt:0,weighted:0,won:0};
  us.forEach(u=>{ const k=u.D.kpi||{}; K.fbGoal+=(k.fbGoal||42); });
  if(per){
    K.fbDone=fb.length;
    K.buyers=new Set(fb.map(r=>r.b)).size;
    K.hot=fb.filter(r=>r.react==="高").length;
    K.countries=new Set(fb.map(r=>r.c)).size;
    K.quotes=fb.filter(r=>r.price&&r.price!=="—").length;
    K.won=orders.length;
  }else{
    us.forEach(u=>{ const k=u.D.kpi||{};
      K.fbDone+=k.fbDone||0; K.buyers+=k.buyers||0; K.hot+=k.hot||0;
      K.countries=Math.max(K.countries,k.countries||0);
      K.quotes+=k.quotes||0; K.quoteAmt+=amtParse(k.quoteAmt).v||0; K.weighted+=amtParse(k.weighted).v||0;
      K.won+=k.won||0; });
  }
  /* 国別 */
  let byc;
  if(per){ const m={}; fb.forEach(r=>{ if(r.c) m[r.c]=(m[r.c]||0)+1; }); byc=Object.entries(m).sort((a,b)=>b[1]-a[1]); }
  else { const m={}; us.forEach(u=>(u.D.byc||[]).forEach(([c,v])=>{ m[c]=(m[c]||0)+v; })); byc=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10); }
  /* 失注理由 */
  let lost;
  if(per){ const m={}; fb.filter(r=>r.st==="失注").forEach(r=>{ const w=r.why||"理由未記録"; m[w]=(m[w]||0)+1; }); lost=Object.entries(m).sort((a,b)=>b[1]-a[1]); }
  else { const m={}; us.forEach(u=>(u.D.lost||[]).forEach(([w,v])=>{ m[w]=(m[w]||0)+v; })); lost=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8); }
  /* ファネル */
  let funnel,funnelNote="";
  if(per){
    funnel=[["反応を記録",fb.length],["見積を提示",fb.filter(r=>r.price&&r.price!=="—").length],
      ["サンプル発送",fb.filter(r=>r.st==="サンプル発送").length],["初回受注",orders.length]];
    funnelNote="期間指定中は<b>日付を持つ商談記録・受注</b>だけで集計しています（接触数・商談実施数は日付を持たないため対象外）。";
  }else{
    const base=(us[0]&&us[0].D.funnel)||[];
    funnel=base.map((row,i)=>[row[0],us.reduce((a,u)=>a+(((u.D.funnel||[])[i]||[])[1]||0),0)]);
  }
  return {us,per,fb,orders,K,byc,lost,funnel,funnelNote,money:dashMoney(orders)};
}

/* ── スコープバー ── */
function dashBar(){
  const all=dashUnits(), depts=dashDepts();
  if(all.length<=1&&!depts.length) return "";
  const cos=[...new Set(all.map(u=>u.co))];

      ${sel("全カテゴリ","カテゴリ",cats.map(c=>[c,c]),DASH.cat,"cat")}

        <input type="date" class="sel" style="min-height:30px;padding:3px 6px;font-size:11px" value="${esc(DASH.from)}" onchange="dashSet('from',this.value)">〜
        <input type="date" class="sel" style="min-height:30px;padding:3px 6px;font-size:11px" value="${esc(DASH.to)}" onchange="dashSet('to',this.value)"></label>

      <button class="btn g" style="padding:4px 9px;font-size:10.5px;margin-left:auto" onclick="openDashGroups()">⚙ 部署・部門グループ</button>

/* ═══════════ ② ダッシュボードAI分析：チャットで依頼→集計→グラフ・表・Excel/PPTX・共有リンク ═══════════ */
let DREP=null;   /* 直近の分析結果 {title,insight,chart:{type,title,labels,values},table:{cols,rows}} */
const DCH_COLORS=["#0064BF","#F8951D","#2E7D32","#B26B00","#46566D","#8A97A6","#7B5EA7","#C43D3B"];

/* ── 分析の元データ（現在のスコープ・期間で切ったもの） ── */
function dashAIData(){
  const A=dashAgg(dashScopeUnits());
  return {
    scope:dashScopeName(), period:(DASH.from||DASH.to)?`${DASH.from||"…"}〜${DASH.to||"…"}`:"全期間",
    fb:A.fb.map(r=>({date:r.d||"",buyer:r.b||"",country:r.c||"",channel:r.ch||"",item:r._item||"",
      status:r.st||"",react:r.react||"",price:r.price||"",owner:r.owner||"",why:r.why||""})),
    orders:A.orders.map(o=>({no:o.no,buyer:o.buyer,country:o.cty,item:o.item,qty:o.qty,unit:o.unit,total:o.total,ship:o.dISO})),
    funnel:A.funnel, byc:A.byc, lost:A.lost,
    kpi:{fbDone:A.K.fbDone,buyers:A.K.buyers,hot:A.K.hot,quotes:A.K.quotes,won:A.K.won,
      jpy:Math.round(A.money.jpy),usd:Math.round(A.money.usd)}
  };
}

/* ── プリセット分析（AI未接続でも決定論で動く） ── */
function dashRepLocal(kind){
  const d=dashAIData();
  const base={scope:d.scope,period:d.period};
  if(kind==="conv"){
    const F=d.funnel, rows=F.map((f,i)=>[f[0],String(f[1]),i&&F[i-1][1]?Math.round(f[1]/F[i-1][1]*100)+"%":"—"]);
    return {...base,title:"ファネル転換率分析",
      insight:`接触から受注までの転換率です。${F.length>2&&F[1][1]?`商談→反応記録は${Math.round((F[2][1]||0)/F[1][1]*100)}%。`:""}最も落ちる段が改善ポイントです。`,
      chart:{type:"bar",title:"段階別の件数",labels:F.map(f=>f[0]),values:F.map(f=>f[1])},
      table:{cols:["段階","件数","前段からの転換率"],rows}};
  }
  if(kind==="cty"){
    return {...base,title:"国別の商談内訳",
      insight:d.byc.length?`商談記録が最も多いのは${d.byc[0][0]}（${d.byc[0][1]}件）。上位3か国で全体の${Math.round(d.byc.slice(0,3).reduce((a,x)=>a+x[1],0)/Math.max(1,d.byc.reduce((a,x)=>a+x[1],0))*100)}%を占めます。`:"商談記録がまだありません。",
      chart:{type:"pie",title:"国別 商談記録",labels:d.byc.map(x=>x[0]),values:d.byc.map(x=>x[1])},
      table:{cols:["国","商談記録"],rows:d.byc.map(x=>[x[0],String(x[1])])}};
  }
  if(kind==="month"){
    const m={}; d.fb.forEach(r=>{ const k=(r.date||"").slice(0,7); if(k) m[k]=(m[k]||0)+1; });
    const ks=Object.keys(m).sort();
    return {...base,title:"月次の商談記録推移",
      insight:ks.length?`${ks[0]}〜${ks[ks.length-1]}の商談記録の推移です。`:"日付つきの商談記録がまだありません。",
      chart:{type:"line",title:"月別 商談記録数",labels:ks,values:ks.map(k=>m[k])},
      table:{cols:["月","商談記録"],rows:ks.map(k=>[k,String(m[k])])}};
  }
  if(kind==="lost"){
    return {...base,title:"失注理由の内訳",
      insight:d.lost.length?`最多の失注理由は「${d.lost[0][0]}」（${d.lost[0][1]}件）。ここを解消すると再挑戦できる相手が最も多く残っています。`:"失注の記録がまだありません。",
      chart:{type:"pie",title:"失注理由",labels:d.lost.map(x=>x[0]),values:d.lost.map(x=>x[1])},
      table:{cols:["理由","件数"],rows:d.lost.map(x=>[x[0],String(x[1])])}};
  }
  if(kind==="owner"){
    const m={}; d.fb.forEach(r=>{ const k=r.owner||"（担当未記録）"; (m[k]=m[k]||{n:0,hot:0}); m[k].n++; if(r.react==="高") m[k].hot++; });
    const es=Object.entries(m).sort((a,b)=>b[1].n-a[1].n);
    return {...base,title:"担当・拠点別の商談記録",
      insight:es.length?`商談記録が最も多いのは${es[0][0]}（${es[0][1].n}件）。`:"商談記録がまだありません。",
      chart:{type:"bar",title:"担当・拠点別 件数",labels:es.map(x=>x[0]),values:es.map(x=>x[1].n)},
      table:{cols:["担当・拠点","記録","手応え高"],rows:es.map(x=>[x[0],String(x[1].n),String(x[1].hot)])}};
  }
  if(kind==="orders"){
    return {...base,title:"受注サマリー",
      insight:d.orders.length?`受注${d.orders.length}件・累計 ¥${d.kpi.jpy.toLocaleString()}（US$${d.kpi.usd.toLocaleString()}）。Invoice書類と同一ソースです。`:"受注はまだありません。",
      chart:{type:"bar",title:"受注金額（US$）",labels:d.orders.map(o=>String(o.buyer).slice(0,12)),values:d.orders.map(o=>amtParse(o.total).v)},
      table:{cols:["受注No","バイヤー","国","商品","数量","単価","Invoice金額","出荷予定"],
        rows:d.orders.map(o=>[o.no,o.buyer,o.country,o.item,o.qty,o.unit,o.total,o.ship||"—"])}};
  }
  return null;
}

/* ── 自由入力（AI接続時）：データを渡してJSONで集計させる ── */
async function dashRepAsk(q){
  const d=dashAIData();
  const r=await llmAsk(
`=== 集計範囲 ===
スコープ: ${d.scope}／期間: ${d.period}
=== 商談記録 (${d.fb.length}件) ===
${JSON.stringify(d.fb).slice(0,9000)}
=== 受注 (${d.orders.length}件) ===
${JSON.stringify(d.orders).slice(0,2500)}
=== ファネル ===
${JSON.stringify(d.funnel)}
=== 国別商談 ===
${JSON.stringify(d.byc)}
=== 失注理由 ===
${JSON.stringify(d.lost)}
=== 分析依頼 ===
「${q}」`,1600,{noWeb:1,timeout:90000,
    sys:`あなたは貿易データアナリスト。提供データ【のみ】から依頼の集計・分析を行いJSONだけ返す:
{"title":"分析タイトル（20字以内）",
 "insight":"所見。数値はすべて提供データから計算し根拠を示す。データに無い軸を求められたら、その旨を正直に書き代替の切り口を提案（創作禁止）。4文以内",
 "chart":{"type":"pie|bar|line|none","title":"グラフ題","labels":["…"],"values":[数値…]},
 "table":{"cols":["…"],"rows":[["…"]…最大15行]}}
labelsとvaluesは同数。割合はvaluesに%数値。表は依頼に最も合う粒度で。`});
  let t=r.txt.replace(/```json|```/g,"").trim();
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<=a) throw new Error("分析結果の形式が不正でした");
  const j=JSON.parse(t.slice(a,b+1));
  const ch=j.chart&&j.chart.type&&j.chart.type!=="none"&&Array.isArray(j.chart.labels)&&Array.isArray(j.chart.values)&&j.chart.labels.length===j.chart.values.length
    ?{type:String(j.chart.type),title:String(j.chart.title||""),labels:j.chart.labels.map(String).slice(0,12),values:j.chart.values.map(Number).slice(0,12)}:null;
  const tb=j.table&&Array.isArray(j.table.cols)&&Array.isArray(j.table.rows)
    ?{cols:j.table.cols.map(String).slice(0,8),rows:j.table.rows.slice(0,15).map(rw=>(rw||[]).map(String).slice(0,8))}:null;
  return {scope:d.scope,period:d.period,title:String(j.title||"分析結果").slice(0,40),
    insight:String(j.insight||"").slice(0,400),chart:ch,table:tb};
}

/* ── グラフSVG（円・棒・折れ線） ── */
function dashChartSvg(ch,w,h){
  if(!ch||!ch.labels||!ch.labels.length) return "";
  w=w||420; h=h||210;
  const C=DCH_COLORS, esc2=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const legend=ch.labels.map((l,i)=>`<div style="display:flex;gap:5px;align-items:center;font-size:10px">
    <span style="width:9px;height:9px;border-radius:2px;background:${C[i%C.length]};flex:0 0 auto"></span>
    <span style="color:var(--ink-2)">${esc(l)} <b class="n">${(+ch.values[i]).toLocaleString()}</b></span></div>`).join("");
  if(ch.type==="pie"){
    const tot=ch.values.reduce((a,v)=>a+Math.max(0,+v||0),0)||1;
    let ang=-90; const cx=h/2,cy=h/2,R=h/2-6;
    const arcs=ch.values.map((v,i)=>{
      const a1=ang, a2=ang+(Math.max(0,+v||0)/tot)*360; ang=a2;
      if(a2-a1>=359.9) return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${C[i%C.length]}"/>`;
      const p=(a)=>[cx+R*Math.cos(a*Math.PI/180),cy+R*Math.sin(a*Math.PI/180)];
      const q1=p(a1),q2=p(a2);
      return `<path d="M${cx},${cy} L${q1[0].toFixed(1)},${q1[1].toFixed(1)} A${R},${R} 0 ${a2-a1>180?1:0} 1 ${q2[0].toFixed(1)},${q2[1].toFixed(1)} Z" fill="${C[i%C.length]}"/>`;
    }).join("");
    return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <svg viewBox="0 0 ${h} ${h}" style="width:${h}px;height:${h}px;flex:0 0 auto">${arcs}</svg>
      <div style="display:grid;gap:3px">${legend}</div></div>`;
  }
  const mx=Math.max(1,...ch.values.map(v=>+v||0));
  if(ch.type==="line"){
    const n=ch.values.length, px=i=>20+(n<2?0:i*(w-40)/(n-1)), py=v=>h-24-((+v||0)/mx)*(h-44);
    const pts=ch.values.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px">
      <polyline points="${pts}" fill="none" stroke="${C[0]}" stroke-width="2.5" stroke-linejoin="round"/>

/* ── 共有リンク（データはURLに内包。パスコードはAES-GCMで実暗号化・有効期限・DL権限） ── */
function b64u(u8){ let s=""; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64uDec(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  const bin=atob(s), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function repKey(pass,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:60000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function repEnc(pass,txt){
  const salt=crypto.getRandomValues(new Uint8Array(12)), iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await repKey(pass,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(txt)));
  return b64u(salt)+"."+b64u(iv)+"."+b64u(ct);
}
async function repDec(pass,packed){
  const seg=packed.split(".");
  const k=await repKey(pass,b64uDec(seg[0]));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64uDec(seg[1])},k,b64uDec(seg[2]));
  return new TextDecoder().decode(pt);
}

/* ── 自律ルーティング：質問内容に応じて最適かつ最安のエンジン・モデルを選ぶ ──
   優先表（左ほど優先。能力を満たすものから最安を選ぶ）：
   ・Web検索が必要 → ネイティブ検索を持つ Perplexity ＞ Gemini
   ・PDF読取 → Gemini ＞ Claude ＞ ChatGPT／画像 → Gemini ＞ Claude ＞ ChatGPT ＞ Perplexity
   ・契約書・複雑な判断（task:"legal"/"heavy"）→ 品質優先 Claude ＞ ChatGPT ＞ Gemini ＞ Perplexity（最上位モデル）
   ・抽出・翻訳・通常の質問 → 最安の高速モデル Gemini ＞ Claude(Haiku) ＞ Perplexity ＞ ChatGPT */
function llmRoute(opts){
  opts=opts||{};
  const act=llmActive();
  if(!act.length) return null;
  const forced=opts.prov&&act.includes(opts.prov)?opts.prov:null;
  const one=act.length===1||LLM.route===false;
  const pick=order=>{ const hit=order.find(p=>act.includes(p)); return hit||act[0]; };
  let p, tier="std", why="標準";
  const att=opts.att;
  if(forced){ p=forced; why="指定"; }
  else if(one){ p=act.includes(LLM.prov)?LLM.prov:act[0]; why="単独接続"; }
  else if(att&&att.mime==="application/pdf"){ p=pick(["gemini","anthropic","openai"]); why="PDF読取"; }
  else if(att){ p=pick(["gemini","anthropic","openai","perplexity"]); why="画像読取"; }
  else if(opts.needWeb){ p=pick(["perplexity","gemini"]); why="Web検索"; }
  else if(opts.task==="legal"||opts.task==="heavy"){ p=pick(["anthropic","openai","gemini","perplexity"]); tier="pro"; why="高精度（法務・複雑判断）"; }
  else { p=pick(["gemini","anthropic","perplexity","openai"]); why="最安・高速"; }
  if(opts.task==="legal"||opts.task==="heavy") tier="pro";   /* prov指定の切替時も高精度ティア維持 */
  return {prov:p,model:opts.model||llmModelOf(p,opts.planTier||tier),why};
}

/* 参考Web情報（ライブ検索なしのプロバイダ向け）：logic_webのライブ検索結果を文字列化 */
async function llmWebCtx(q){
  try{
    if(typeof liveSearch!=="function") return {txt:"",hits:[]};
    const live=await liveSearch(q);
    const snap=(typeof searchWeb==="function")?searchWeb(q):[];
    const hits=[...live.hits];
    for(const h of snap){ if(hits.length>=3) break; if(!hits.some(x=>x.t===h.t)) hits.push(h); }
    if(!hits.length) return {txt:"",hits:[]};
    return {txt:"\n\n=== 参考Web情報（いま取得） ===\n"+hits.map(h=>`【${h.t}】${h.s}（${h.src}・${h.d}）`).join("\n"),hits};
  }catch(e){ return {txt:"",hits:[]}; }
}

/* プロバイダ別のAPI呼び出し。戻り値 {txt,cits,model} */
async function llmAsk(q,maxTok,opts){
  if(typeof window!=="undefined"&&window.__llmMock) return window.__llmMock(q,maxTok,opts);
  opts=opts||{};
  /* 自律ルーティング：質問内容（添付・Web検索・task）に応じて最適かつ最安のエンジンを選択。
     opts.model は呼び出し側の明示指定（物流会社プラン等）として最優先。 */
  const wantWeb=(opts.forceWeb||((typeof WEBON!=="undefined"&&WEBON&&(typeof webPerm!=="function"||webPerm()))&&!opts.noWeb));
  const RT=llmRoute({att:opts.att,needWeb:wantWeb&&!opts.noWeb,task:opts.task,model:opts.model,prov:opts.prov,planTier:opts.planTier})
    ||{prov:LLM.prov,model:opts.model||llmModel(),why:"未接続"};
  const prov=RT.prov, P=PROV[prov], key=llmKeyOf(prov), model=RT.model, ep=llmEpOf(prov);
  const sys=opts.sys||llmSysPrompt();
  const webOK=(opts.forceWeb&&P.search)
    ||((typeof WEBON!=="undefined"&&WEBON&&(typeof webPerm!=="function"||webPerm()))&&!opts.noWeb);
  let userQ=q, extHits=[];
  if(webOK&&!P.search){ const w=await llmWebCtx(q); userQ=q+w.txt; extHits=w.hits; }

  const att=opts.att;   /* {mime,b64,name}：PDF・画像の添付（プロバイダ別に組み立て） */
  let req;
  if(prov==="gemini"){
    const parts=[{text:userQ}];
    if(att) parts.push({inline_data:{mime_type:att.mime,data:att.b64}});
    const body={system_instruction:{parts:[{text:sys}]},
      contents:[{role:"user",parts}],
      generationConfig:{maxOutputTokens:(maxTok||900)+(/-3\.5|pro|think/i.test(model)?8000:0),temperature:0.2}};
    if(webOK&&!att) body.tools=[{google_search:{}}];
    req=fetch(ep+"/models/"+encodeURIComponent(model)+":generateContent",
      {method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
       body:JSON.stringify(body)});
  } else if(prov==="anthropic"){
    /* 注意：Claude 5系はtemperature非対応のため送らない。max_tokensはthinking込みなので大きめに */
    let content=userQ;
    if(att) content=[
      att.mime==="application/pdf"
        ?{type:"document",source:{type:"base64",media_type:att.mime,data:att.b64}}
        :{type:"image",source:{type:"base64",media_type:att.mime,data:att.b64}},
      {type:"text",text:userQ}];
    const body={model,max_tokens:Math.max(maxTok||900,700),system:sys,
      messages:[{role:"user",content}]};
    req=fetch(ep,{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify(body)});
  } else { /* perplexity / openai：OpenAI互換Chat Completions */
    let uc=userQ;
    if(att){
      const dataUrl="data:"+att.mime+";base64,"+att.b64;
      if(att.mime==="application/pdf"&&prov==="openai")
        uc=[{type:"file",file:{filename:att.name||"file.pdf",file_data:dataUrl}},{type:"text",text:userQ}];
      else uc=[{type:"image_url",image_url:{url:dataUrl}},{type:"text",text:userQ}];
    }
    const body={model,messages:[{role:"system",content:sys},{role:"user",content:uc}]};
    if(prov==="openai"){
      /* gpt-5系・o系は推論モデル：内部思考トークンがmax_completion_tokensを消費するため、
         ヘッドルームを大きく確保し（上限は課金されない）、思考量を抑える指定を付ける。
         これが小さいと「本文が空・finish_reason:length」で返る。 */
      const reasoning=/^(gpt-5|o[1-9])/i.test(model);
      body.max_completion_tokens=(maxTok||900)+(reasoning?8000:0);
      if(reasoning) body.reasoning_effort=opts._retry2?"minimal":"low";
    }
    else { body.max_tokens=maxTok||900; body.temperature=0.2; }
    req=fetch(ep,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify(body)});
  }
  const toMs=opts.timeout||(prov==="anthropic"?45000:25000);
  let r;
  try{
    r=await Promise.race([req,
      new Promise((_,rj)=>setTimeout(()=>rj(new Error("タイムアウト("+Math.round(toMs/1000)+"秒)")),toMs))]);
  }catch(e){
    if(/Failed to fetch|NetworkError|Load failed/i.test(String(e.message))){
      throw new Error(prov==="openai"
        ?"接続不可：この環境からOpenAIへ直接接続できませんでした（ネットワーク制限の可能性。プロキシ経由のエンドポイント指定、またはGemini/Claude/Perplexityをご検討ください）"
        :"接続不可：外部通信が遮断されているか、ネットワークエラーです");
    }
    throw e;
  }
  if(!r.ok){ let msg=""; try{const e=await r.json();
      msg=(e.error&&(e.error.message||e.error.type))||e.message||"";}catch(e){}
    throw new Error("HTTP "+r.status+(msg?"："+String(msg).slice(0,110):"")); }
  const jr=await r.json();

  let txt="",cits=[],mdl=model,cut=false;
  if(prov==="gemini"){

    if(!cand){ const br=jr.promptFeedback&&jr.promptFeedback.blockReason;
      throw new Error(br?("回答がブロックされました："+br):"回答が返りませんでした"); }
    txt=((cand.content&&cand.content.parts)||[]).map(p=>p.text||"").join("");

    mdl=jr.modelVersion||model;
  } else if(prov==="anthropic"){
    if(jr.stop_reason==="refusal") throw new Error("安全性の観点から回答が控えられました");
    txt=(jr.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    cut=jr.stop_reason==="max_tokens";
    mdl=jr.model||model;
  } else {
    txt=(jr.choices&&jr.choices[0]&&jr.choices[0].message&&jr.choices[0].message.content)||"";
    cut=!!(jr.choices&&jr.choices[0]&&jr.choices[0].finish_reason==="length");
    cits=jr.citations||[];
    if((!cits||!cits.length)&&jr.search_results) cits=jr.search_results.map(x=>x.url).filter(Boolean);
    mdl=jr.model||model;
  }
  if(!txt.trim()){
    /* 推論モデルが思考でトークンを使い切ると本文が空になる → 上限を3倍にして1回だけ自動再試行 */
    if(!opts._retry2)
      return llmAsk(q,(maxTok||900)*3+2000,Object.assign({},opts,{prov,_retry2:1,_noFo:1,_why0:opts._why0||RT.why}));
    throw new Error("回答が空でした（AIの内部思考がトークン上限に達した可能性。もう一度お試しいただくか、管理コンソールでモデルを変更してください）");
  }
  if(cut&&!opts._retry2){
    /* 文の途中で出力上限に達した（finish=MAX_TOKENS/length/max_tokens）→ 上限を拡大して自動で取り直す */
    return llmAsk(q,(maxTok||900)*3+2000,Object.assign({},opts,{prov,_retry2:1,_noFo:1,_why0:opts._why0||RT.why}));
  }
  return {txt,cits:cits||[],model:mdl,extHits,prov,provNm:PROV[prov].short,
    why:(opts._why0||RT.why)+(cut?"・長文のため一部省略":"")};
}

/* ── 多社フェイルオーバー ──
   自動選択で選ばれたエンジンが 429（クォータ超過）等で失敗した場合、内蔵エンジンに落とす前に
   残りの有効エンジンへ順に切り替える。切替の事実は回答の根拠行（why）に明示する。 */
const __llmAskCore=llmAsk;
llmAsk=async function(q,maxTok,opts){
  opts=opts||{};
  if(opts.prov||opts._noFo) return __llmAskCore(q,maxTok,opts);
  const act=llmActive();
  if(act.length<2) return __llmAskCore(q,maxTok,opts);
  const wantWeb=(opts.forceWeb||((typeof WEBON!=="undefined"&&WEBON&&(typeof webPerm!=="function"||webPerm()))&&!opts.noWeb));
  const rt=llmRoute({att:opts.att,needWeb:wantWeb&&!opts.noWeb,task:opts.task,model:opts.model,planTier:opts.planTier});
  const order=[rt.prov].concat(act.filter(p=>p!==rt.prov));
  let last=null;
  for(let i=0;i<order.length;i++){
    const o=Object.assign({},opts,{prov:order[i],_noFo:1});
    if(i>0) delete o.model;   /* 明示モデル名は元エンジン専用のため切替先では既定に戻す */
    try{
      const r=await __llmAskCore(q,maxTok,o);
      r.why=(i===0)?rt.why+(String(r.why||"").includes("一部省略")?"・長文のため一部省略":"")
        :(((PROV[order[i-1]]&&PROV[order[i-1]].short)||order[i-1])+"がエラーのため自動切替");
      return r;
    }catch(e){ last=e; }
  }
  throw last;
};

}
const __brainB4pplx=brain;
brain=function(q){
  /* バイヤーDBの列挙・件数質問はDB直接照会で即答（接続の有無に関わらず正確） */
  if(typeof bnAsk==="function"){ const b=bnAsk(q); if(b) return b; }
  /* 物流費・運賃の質問：登録レートがあればDB直接照会で即答。未登録×未接続は正直回答 */
  if(typeof shipRateAsk==="function"){ const sr=shipRateAsk(q,ppReady()); if(sr) return sr; }
  if(!ppReady()) return __brainB4pplx(q);
  return (async()=>{
    try{
      let q2=q;
      const bx=typeof bnCtxFor==="function"?bnCtxFor(q):"";
      if(bx) q2=q+"\n\n"+bx;
      const sx=typeof shipRateCtx==="function"?shipRateCtx(q):"";
      if(sx) q2=q2+"\n\n"+sx;
      const r=await llmAsk(q2);
      let a=ppFormat(r.txt);
      if(r.cits&&r.cits.length){
        a+=`<div style="margin-top:10px;border:1px solid var(--bl);border-radius:var(--r2);overflow:hidden">
          <div style="background:var(--bl-soft);padding:5px 10px;font-size:10px;font-weight:700;color:var(--bl)">🌐 出典（${esc(llmLabel())}によるライブ検索）</div>
          <div style="padding:7px 11px;font-size:10.5px;line-height:1.9;word-break:break-all">
          ${r.cits.slice(0,5).map((u,i)=>`[${i+1}] <a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--bl)">${esc(String(u).replace(/^https?:\/\//,"").slice(0,64))}</a>`).join("<br>")}</div></div>`;
      } else if(r.extHits&&r.extHits.length&&typeof webBlock==="function"){
        a+=webBlock(r.extHits,r.extHits.some(h=>h.live)?"mixed":"snap");
      }
      const usedWeb=(r.cits&&r.cits.length)||(r.extHits&&r.extHits.length);
      if(typeof logU==="function"&&typeof WEBON!=="undefined"&&WEBON&&usedWeb)
        logU("web",llmLabel()+"検索："+String(q).slice(0,32));
      return {a,c:`エンジン：${esc(r.provNm||PROV[LLM.prov].short)} ${esc(r.model)}（${esc(r.why||"実AI")}・自動選択）／社内データを注入済み`+
        (usedWeb?`／Web情報を参照`:`／Web検索は未使用`)};
    }catch(e){
      /* 全エンジン失敗：物流費質問はレートDBの正直回答を優先してから内蔵へ */
      const so=typeof shipRateAsk==="function"?shipRateAsk(q,false):null;
      const r=so||await Promise.resolve(__brainB4pplx(q));
      r.c+=`／⚠ ${esc(llmLabel())}接続不可（${esc(String(e.message)).slice(0,80)}）→ ${so?"社内物流レートDB":"内蔵エンジン"}で回答`;
      return r;
    }
  })();
};

async function llmGapAnalyze(){
  const s=scoreOf(TEN);

  const sys=`あなたは総合商社で20年の経験がある貿易のプロフェッショナルです。
中小企業の輸出担当者がアップロードした商品資料（解析済みデータ）を読み、輸出実務を進める上で
「チェックリストには無いが、この商材なら確認しておくべき点」を見つけてください。
出力は必ず次のJSONだけ（前後に文章・コードフェンス禁止）：
{"insights":["資料から読み取れた重要な気づき（最大3件、各60字以内、商材固有の内容）"],
 "questions":[{"q":"担当者への追加質問（丁寧な日本語、1文、具体的に）","why":"なぜ輸出実務で必要か（30字以内）"}]}
questionsは最大3件。既に埋まっている項目の再質問や、一般論は禁止。
この商材・この資料だからこそ聞くべきこと（例：温度管理、認証の有効期限、規格の適合範囲、名称の商標、危険物該当性、シェルフライフと輸送日数の関係など）に絞ってください。`;
  const user=`=== 解析済みの商品データ ===\n${ppContext()}\n\n=== チェックリスト上の未充足項目 ===\n${missing}`;
  const r=await llmAsk(user,900,{sys,noWeb:1,timeout:60000});
  let t=r.txt.replace(/```json|```/g,"").trim();
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<=a) throw new Error("解析結果の形式が不正");
  const j=JSON.parse(t.slice(a,b+1));
  const insights=(Array.isArray(j.insights)?j.insights:[]).map(x=>String(x).slice(0,120)).filter(Boolean).slice(0,3);
  const questions=(Array.isArray(j.questions)?j.questions:[]).map(x=>({
    q:String(x&&x.q||"").slice(0,180),why:String(x&&x.why||"").slice(0,90)})).filter(x=>x.q).slice(0,3);
  return {insights,questions};
}

function ppBind(){

      const ck=document.querySelector(`[data-ppact="${k}"]`);
      const ky=document.querySelector(`[data-ppkey="${k}"]`);

      if(ck) LLM.act[k]=ck.checked&&!!(LLM.keys[k]||"").trim();
    });

    const pv=$("#ppprov"); if(pv) LLM.prov=pv.value;
    LLM.on=llmActive().length>0;
  };
  const res=(m2,ok)=>{const e=$("#ppres");if(e){e.innerHTML=m2;e.style.color=ok?"var(--good)":"var(--crit)";}};
  const sv=$("#ppsave");
  if(sv) sv.onclick=()=>{rd();ppSave();renderAdmin();

    toast(act.length?("保存しました（"+act.map(k=>PROV[k].short).join("・")+" 接続中"+(act.length>=2&&LLM.route!==false?"・自動選択":"")+"）"):"保存しました（未接続＝内蔵エンジン）");};
  document.querySelectorAll("[data-pptest]").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.pptest; rd();
    if(!(LLM.keys[k]||"").trim()){ res(PROV[k].nm+"：APIキーを入力してください。",false); return; }
    res("接続しています…（"+esc(PROV[k].nm)+"）",true);
    const keepAct=LLM.act[k], keepOn=LLM.on;
    LLM.act[k]=true; LLM.on=true;
    try{ const r=await llmAsk("接続テストです。「接続OK」とだけ日本語で答えてください。",300,{noWeb:1,prov:k,model:llmModelOf(k)});
      res(`✓ ${esc(PROV[k].nm)}：接続できました（model: ${esc(r.model)}／応答: ${esc(r.txt).slice(0,30)}）。✓を入れて「保存」すると有効になります。`,true); }
    catch(e){ res(`✗ ${esc(PROV[k].nm)}：接続できませんでした：`+esc(String(e.message)).slice(0,140),false); }
    LLM.act[k]=keepAct; LLM.on=keepOn;
  });
}

/* ── 見積ロジック（AI物流マン） ── */
function fwdFindRate(pod){
  const R=FWDB.rates;
  return R.find(r=>r.pod===pod&&r.mode==="LCL")
    ||R.find(r=>r.pod===pod)
    ||R.find(r=>r.pod.includes(pod)||pod.includes(r.pod))            /* 部分一致（「基隆」⊂「台湾・基隆」等） */
    ||R.find(r=>(r.note||"").includes(pod))
    ||null;
}
function fwdQuoteCalc(rate,cbm){
  if(rate.mode==="COURIER"){
    /* 小包・クーリエ：1個（最小重量帯）基準。THC・書類費は運賃込みが通例 */
    return {freight:rate.price,thc:0,doc:0,total:rate.price,tt:rate.tt,valid:rate.valid,
      lane:rate.pol+" → "+rate.pod,mode:rate.mode,unit:rate.cur+rate.price.toLocaleString()+rate.unit,
      courier:1};
  }
  const freight=Math.round(rate.price*Math.max(1,cbm));
  return {freight,thc:FWD_THC,doc:FWD_DOC,total:freight+FWD_THC+FWD_DOC,tt:rate.tt,valid:rate.valid,
    lane:rate.pol+" → "+rate.pod,mode:rate.mode,unit:rate.cur+rate.price.toLocaleString()+rate.unit};
}

}

async function fwdMsgsAI(req){
  const facts=req.legs.map(l=>l.ok
    ?`${l.cty}: ${l.quote.lane}（${l.quote.mode}）合計¥${l.quote.total.toLocaleString()}（運賃¥${l.quote.freight.toLocaleString()}＋諸掛¥${(l.quote.thc+l.quote.doc).toLocaleString()}）所要${l.quote.tt}日 有効${l.quote.valid}`
    :`${l.cty}: レーン未登録（提案不可。レート整備後に自動見積、代替はSTANDAGE相見積）`).join("\n");
  const r=await llmAsk(
`荷主側AI（AI商社マン）と物流会社側AI（AI物流マン）の見積交渉を、以下の事実だけで簡潔に再現してください。返答はJSONのみ：
{"msgs":[{"f":"商|物","t":"発言（HTMLタグ不可・改行は\\n）"}]}
・msgsは5件（商→物→商→物→商の順）。1件2〜4文。
・事実：仕出 ${req.pol}／貨物 ${req.item}（${req.cat}・非危険物）各${req.cbm}m³ LCL／仕向国別の照合結果：
${facts}
・物流マンは危険物と貨物量を確認→国別に照合結果を提示（提案できる国とできない国を正直に分ける）。
　最後は商社マンが荷主向けに「提案できる国の金額」と「未登録国の扱い」をまとめる。
・数字と可否は上の事実から一切変えないこと。`,1600,{noWeb:1,timeout:60000,
    planTier:(typeof FWDPLAN!=="undefined"&&FWDPLAN==="pro"?"pro":"std"),
    sys:"あなたは貿易実務のシミュレーター。返答は指定JSONのみ。"});
  let t=r.txt.replace(/```json|```/g,"").trim();
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  const j=JSON.parse(t.slice(a,b+1));
  if(!Array.isArray(j.msgs)||j.msgs.length<3) throw new Error("形式不正");
  return j.msgs.map(m=>({f:/物/.test(m.f)?"物":"商",t:esc(String(m.t||"")).replace(/\n/g,"<br>")}));
}
/* 荷主側：見積依頼の実行（進出希望国をまとめて照合。1か国でも該当があれば提案する） */
async function fwdRequest(){
  if(!D||!D.ship){ toast("先に価格表・寸法・進出希望国を登録してください"); return; }
  fwdLoad();
  if(typeof llmReload==="function") llmReload();
  const pol=D.pol||"横浜港";
  const ctys=[...new Set(
    ([D.ship.country].concat((typeof TEN!=="undefined"&&TEN&&TEN.targets)||[]))
      .flatMap(c=>String(c).split(/[・･、,\/／\s]+/)).filter(Boolean)
      .map(c=>typeof cnorm==="function"?cnorm(c):c))].slice(0,5);   /* いま開いている案件の国を必ず第1レッグに */
  const legs=ctys.map(c=>{
    const pod=FWD_POD[c]||c;
    const rate=fwdFindRate(pod)||(pod!==c?fwdFindRate(c):null);
    return rate?{cty:c,pod:rate.pod,ok:1,quote:fwdQuoteCalc(rate,2)}:{cty:c,pod,ok:0};
  });
  const ok=legs.filter(l=>l.ok);
  const req={id:"RQ-"+Date.now().toString(36).toUpperCase().slice(-6),d:TODAYS,
    co:(TEN&&TEN.co)||D.co||"荷主",item:D.item||"—",cat:D.cat||"一般貨物",
    cty:ctys.join("・"),pol,pod:legs.map(l=>l.pod).join("・"),mode:"LCL",cbm:2,term:D.term||"FOB",
    legs,status:ok.length?(ok.length<legs.length?"一部AI回答":"AI回答済み"):"レーン未登録",
    msgs:[],quote:null};
  openDW(`<h3>🚚 貿易クラウド内 物流会社へのAI見積</h3>
    <p class="nn" style="margin-top:8px"><span class="spin"></span> AI物流マン（${esc(FWDB.profile.co)}）と、貴社のAI商社マンが<b>${ctys.length}か国分</b>を交渉しています…（数秒〜30秒）</p>`);
  let msgs;
  try{
    /* AI応答文の生成：物流会社側プランを優先、無効なら荷主側エンジン、どちらも無ければ内蔵 */
    const gen=(fwdReady()||(typeof ppReady==="function"&&ppReady()))&&ok.length;
    msgs=gen?await fwdMsgsAI(req):fwdMsgsLocal(req);
  }catch(e){ msgs=fwdMsgsLocal(req); }
  req.msgs=msgs;
  FWDB.reqs.unshift(req); fwdSave();
  fwdHist(`見積依頼を受信：${req.id}（${req.co}／${ctys.join("・")}／${ok.length}/${legs.length}か国 提案）`);
  if(typeof logU==="function") logU("fwd","AI見積依頼:"+ctys.join("・"));
  openFwdQuote(req.id);
}

/* 未接続時の内蔵エンジン（レート・依頼・履歴をルールベースで即答） */
function fwdBrain(q){
  const s=String(q);
  const base=`根拠：レート表 ${FWDB.rates.length}レーン／依頼 ${FWDB.reqs.length}件／履歴 ${(FWDB.hist||[]).length}件（エンジン：内蔵）`;
  /* 国・港の照合 */
  const ctyHit=Object.keys(FWD_POD).find(c=>s.includes(c))||(s.includes("米国")?"アメリカ":null);
  const podHit=[...new Set(FWDB.rates.map(r=>r.pod))].find(p=>s.includes(p));
  if((/レーン|運賃|料金|いくら|向け|出せ|送れ/.test(s))&&(ctyHit||podHit)){
    const key=podHit||FWD_POD[ctyHit]||ctyHit;
    const rs=FWDB.rates.filter(r=>r.pod===key||r.pod.includes(key)||(ctyHit&&(r.pod===ctyHit||r.pod.includes(ctyHit)||(r.note||"").includes(ctyHit))));
    if(rs.length) return {a:`<b>${esc(ctyHit||podHit)}向け</b>は<b>${rs.length}レーン</b>登録があります：<br>`+
      rs.slice(0,6).map(r=>`・${esc(r.pol)}→${esc(r.pod)}（${esc(r.mode)}）<b>${esc(r.cur)}${r.price.toLocaleString()}${esc(r.unit)}</b>／所要${r.tt}日／有効${esc(r.valid)}`).join("<br>"),c:base};
    return {a:`<b>${esc(ctyHit||podHit)}向けのレーンは未登録</b>です。「物流レート管理」からレート表を追加すると、AI物流マンが自動で見積に使います。`,c:base};
  }
  if(/有効期限|期限|切れ/.test(s)){
    const rs=FWDB.rates.slice().sort((a,b)=>String(a.valid).localeCompare(String(b.valid))).slice(0,5);
    return {a:`有効期限が近い順の上位${rs.length}レーンです：<br>`+rs.map(r=>`・${esc(r.valid)}まで：${esc(r.pol)}→${esc(r.pod)}（${esc(r.mode)}）${esc(r.cur)}${r.price.toLocaleString()}${esc(r.unit)}`).join("<br>")+`<br>期限切れになる前に、レート表の更新をおすすめします。`,c:base};
  }
  if(/アップロード|取り込|履歴|いつ/.test(s)){
    const f2=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;};
    const hs=(FWDB.hist||[]).slice(0,8);
    return {a:hs.length?`直近の操作履歴です：<br>`+hs.map(h=>`・${f2(h.t)}　${esc(h.d)}`).join("<br>"):"まだ操作履歴がありません。レート表をアップロードすると、ここに記録されます。",c:base};
  }
  if(/依頼|受信|未対応|案件|見積の状況/.test(s)){
    const ng=FWDB.reqs.filter(r=>r.status==="レーン未登録");
    return {a:`受信した見積依頼は<b>${FWDB.reqs.length}件</b>。うち<b>未対応（レーン未登録）が${ng.length}件</b>です。<br>`+
      FWDB.reqs.slice(0,5).map(r=>`・${esc(r.d)} ${esc(r.id)}（${esc(r.co)}）${esc(r.pol)}→${esc(r.cty)}：${esc(r.status)}${fwdReqCell(r)!=="—"?"／"+esc(fwdReqCell(r)):""}`).join("<br>")+
      (ng.length?`<br><b>未登録の仕向国のレートを追加すると、これらに自動で見積が届きます。</b>`:""),c:base};
  }
  if(/レーン数|何レーン|件数|いくつ/.test(s)){
    const m={}; FWDB.rates.forEach(r=>m[r.mode]=(m[r.mode]||0)+1);
    return {a:`登録レーンは<b>${FWDB.rates.length}本</b>（${Object.entries(m).map(([k,v])=>k+" "+v).join("・")}）。仕向地は${[...new Set(FWDB.rates.map(r=>r.pod))].length}方面です。`,c:base};
  }
  return {a:`AI物流マンです。貴社の<b>レート表（${FWDB.rates.length}レーン）・見積依頼（${FWDB.reqs.length}件）・操作履歴</b>のすべてを見ています。<br>
    例えばこんな質問に答えられます：<br>・「韓国向けのレーンはある？」<br>・「有効期限が近いレートは？」<br>・「最近いつレート表をアップロードした？」<br>・「未対応の依頼は？」<br>
    ${fwdReady()?"":"<span style='font-size:10.5px;color:var(--ink-3)'>AIエンジン接続＋スタンダード以上のプランで、自由な文章の質問にも実AIが答えます。</span>"}`,c:base};
}

/* ── レート表の読み取り ──
   Excel(.xlsx/.xlsm)＝readWorkbookでローカル解析／CSV・TXT＝Shift-JIS自動判定つき解析／
   PDF・画像＝接続AIで抽出。列の並びはヘッダー行（仕出港・仕向港・運賃…）から自動判別し、
   ヘッダーが無い場合は「仕出港,仕向港,形態,運賃,日数」の並び順で読む。 */
function fwdDecodeText(buf){
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^﻿/,""); }
  catch(e){ /* ExcelのCSV保存（日本語Windows）はShift-JISが既定 */
    try{ return new TextDecoder("shift_jis").decode(buf); }
    catch(e2){ return new TextDecoder("utf-8").decode(buf); } }
}
const FWD_HDR={pol:/仕出|発地|出発|積地|積出|from|pol\b|origin/i,
  pod:/仕向|着地|到着|揚地|行き?先|to\b|pod\b|dest/i,
  mode:/形態|モード|種別|サービス|コンテナ|type|mode/i,
  price:/運賃|料金|価格|金額|単価|rate|price|charge/i,
  tt:/日数|所要|リードタイム|transit|t\/t|days?/i,
  valid:/有効|期限|valid|expir/i,note:/備考|注記|条件|note|remark/i};
function fwdParsePrice(s){
  const t=String(s||"");
  const usd=/US\$|USD|\$/.test(t);
  const n=parseFloat(t.replace(/[^\d.]/g,""));
  if(!n||!isFinite(n)) return null;
  return {price:Math.round(n),usd};
}
function fwdNormMode(s){
  const t=String(s||"").toUpperCase();
  if(/COURIER|PARCEL|小包|宅配|クーリエ|EMS|郵便/.test(t)) return "COURIER";
  if(/40/.test(t)) return "FCL40";
  if(/20|FCL/.test(t)) return "FCL20";
  if(/AIR|航空/.test(t)) return "AIR";
  return "LCL";
}
/* グリッド（表の2次元配列）→ レート行。戻り値 {rates,headered} */
function fwdRatesFromGrids(grids){
  const out=[]; let headered=false;
  grids.forEach(g=>{
    if(!g||!g.length) return;
    /* ヘッダー行を探す（2項目以上ヒットする行） */
    let hi=-1, map=null;
    for(let i=0;i<Math.min(g.length,12);i++){
      const row=g[i]||[]; const m={};
      row.forEach((c,ci)=>{ Object.keys(FWD_HDR).forEach(k=>{
        if(m[k]===undefined&&FWD_HDR[k].test(String(c||""))) m[k]=ci; });});
      if(m.pod!==undefined&&m.price!==undefined){ hi=i; map=m; break; }
    }
    if(hi>=0){
      headered=true;
      let lastPol="";
      for(let i=hi+1;i<g.length;i++){
        const r=g[i]||[];
        const pv=fwdParsePrice(r[map.price]);
        const pod=String(r[map.pod]||"").trim();
        if(!pod||!pv) continue;
        const pol=String((map.pol!==undefined?r[map.pol]:"")||"").trim()||lastPol||"横浜港";
        lastPol=pol;
        const mode=fwdNormMode(map.mode!==undefined?r[map.mode]:"");
        out.push({pol,pod,mode,price:pv.price,cur:pv.usd?"US$":"¥",
          unit:mode==="LCL"?"/m³":mode==="AIR"?"/kg":"/本",
          tt:parseInt(String(map.tt!==undefined?r[map.tt]:""),10)||10,
          valid:String((map.valid!==undefined?r[map.valid]:"")||"").trim()||"2026-12-31",
          note:String((map.note!==undefined?r[map.note]:"")||"").trim()+(pv.usd?"（USD建て）":"")});
      }
    } else {
      /* ヘッダーなし：仕出港,仕向港,形態,運賃,日数 の並び */
      g.forEach(r=>{
        if(!r||r.length<4) return;
        const pv=fwdParsePrice(r[3]);
        if(!r[0]||!r[1]||!pv) return;
        const mode=fwdNormMode(r[2]);
        out.push({pol:String(r[0]).trim(),pod:String(r[1]).trim(),mode,price:pv.price,
          cur:pv.usd?"US$":"¥",unit:mode==="LCL"?"/m³":mode==="AIR"?"/kg":"/本",
          tt:parseInt(String(r[4]||""),10)||10,valid:String(r[5]||"").trim()||"2026-12-31",
          note:String(r[6]||"").trim()+(pv.usd?"（USD建て）":"")});
      });
    }
  });
  return {rates:out,headered};
}
/* 接続AIでの抽出（PDF/画像=att、Excel/CSVの難読データ=text）
   海上・航空のレーン表だけでなく、重量帯×国（地帯）の小包・クーリエ料金表も国別レーンに変換して取り込む */
const FWD_XPROMPT=(isText)=>(isText?`次の物流レート表データから運賃レーンを抽出し、`:`添付の物流レート表から運賃レーンを抽出し、`)+
`JSONのみ返してください：
{"rates":[{"pol":"仕出地・仕出港","pod":"仕向地（国名・港名。日本語で）","mode":"LCL|FCL20|FCL40|AIR|COURIER",
"price":数値,"unit":"/m³|/本|/kg|/個(1kg)","tt":所要日数の数値(不明なら省略),"valid":"YYYY-MM-DD(不明なら省略)","note":"備考"}]}
規則：
・海上/航空のレーン表：1レーン=1行。
・重量帯×国（地帯）の小包・宅配・クーリエ料金表の場合：<b>国ごとに1行</b>にまとめる。mode:"COURIER"、
  priceは最小重量帯（例:1.0kg）の料金、unit:"/個(1kg)"、noteに「重量帯制 1kg〜最大◯kg・最大料金◯円」の形で範囲を書く。
  同じ地帯に複数の国が並ぶ場合は、国ごとに同じ料金で別の行にする（国名は日本語：HONG KONG→香港、AUSTRALIA→オーストラリア等）。
・仕出地の記載がなければ pol:"日本"。
・FedEx・DHL・UPS等の<b>ゾーン制の料金表</b>（料金がゾーンA/B/1/2…単位で、別表にゾーン⇔国の対応がある形式）：
  ゾーン定義から国へ展開して国ごとに1行（mode:"COURIER"）。対象国が多い場合は主要20か国に絞る。
  サービス種別（Priority/Economy/Connect等）が複数ある場合は標準的な1種のみを使い、noteにサービス名を書く。
・行数は最大40行。読み取れた行のみ。通貨がUSDならpriceはそのまま数値、noteに"USD建て"と書く。`+
(isText?"":"");
async function fwdRatesLLM(src){
  const ask=(extra,tok)=>llmAsk(FWD_XPROMPT(!!src.text)+(extra||"")+
      (src.text?`\n\n=== データ ===\n${src.text.slice(0,15000)}`:""),tok,
    {att:src.att,noWeb:1,timeout:150000,planTier:(FWDPLAN==="pro"?"pro":"std"),
     sys:"あなたは物流レート表の読み取り専門家。返答は指定JSONのみ（コードフェンス・説明文禁止）。"});
  let j=null,lastRaw="";
  const tryParse=async(extra,tok,prov)=>{
    const o=prov?{prov}:null;
    const r=await (o?llmAsk(FWD_XPROMPT(!!src.text)+(extra||"")+
        (src.text?`\n\n=== データ ===\n${src.text.slice(0,15000)}`:""),tok,
      Object.assign({att:src.att,noWeb:1,timeout:150000,
        sys:"あなたは物流レート表の読み取り専門家。返答は指定JSONのみ（コードフェンス・説明文禁止）。"},o))
      :ask(extra,tok));
    lastRaw=String(r.txt||"");
    return xParseJson(lastRaw);
  };
  try{ j=await tryParse("",4800); }
  catch(e1){
    try{ j=await tryParse("\n※必ず完全なJSONのみ。行が多い場合は主要20行以内に絞ること。",3000); }
    catch(e2){
      /* 使用エンジンの応答がJSONにならない → 別の有効エンジン（ファイル読取対応）で最後の再試行 */
      const act=(typeof llmActive==="function")?llmActive():[];
      const cap=src.att?act.filter(p=>p==="gemini"||p==="anthropic"||p==="openai"):act.slice();
      const rt=(typeof llmRoute==="function")?llmRoute({att:src.att,planTier:(FWDPLAN==="pro"?"pro":"std")}):null;
      const alt=cap.find(p=>!rt||p!==rt.prov);
      if(!alt) throw new Error("AIの応答をレート表として解釈できませんでした（応答冒頭：「"+lastRaw.slice(0,100)+"…」）。Excel（.xlsx）またはCSVでのアップロードなら確実に取り込めます");
      try{ j=await tryParse("\n※必ず完全なJSONのみ。行が多い場合は主要20行以内に絞ること。",3000,alt); }
      catch(e3){ throw new Error("AIの応答をレート表として解釈できませんでした（"+(PROV[alt]&&PROV[alt].short||alt)+"でも再試行済み。応答冒頭：「"+lastRaw.slice(0,100)+"…」）。Excel（.xlsx）またはCSVでのアップロードなら確実に取り込めます"); }
    }
  }
  return (j.rates||[]).filter(x=>x&&x.pod&&+x.price)
    .map(x=>({pol:String(x.pol||"日本"),pod:String(x.pod),mode:fwdNormMode(x.mode),
      price:Math.round(+x.price),cur:/USD/i.test(String(x.note||""))?"US$":"¥",
      unit:String(x.unit||"/m³"),tt:parseInt(x.tt,10)||10,
      valid:String(x.valid||"2026-12-31"),note:String(x.note||"")}));
}

async function fwdRateFile(f){
  if(typeof llmReload==="function") llmReload(); /* 読み取り直前に接続状態を最新化 */
  const st=$("#fwdupst");
  const say=m=>{ const e=$("#fwdupst"); if(e) e.innerHTML=m; };
  const fail=m=>{ const e=$("#fwdupst"); if(e) e.innerHTML=`<div style="padding:11px 13px;border:1px solid var(--crit);background:var(--crit-soft);border-radius:var(--r2);font-size:11.5px;line-height:1.7"><b style="color:var(--crit)">読み取れませんでした</b><br>${m}</div>`; toast("レート表を読み取れませんでした"); };
  const ext=FEXT(f.name);

  const aiHow=()=>"AI抽出（"+esc(fwdEngLabel())+"）";
  try{
    /* Excel（そのまま対応） */
    if(/^(xlsx|xlsm)$/.test(ext)){
      say(`<span class="spin"></span> <b>${esc(f.name)}</b> を解析しています…`);
      const sheets=await readWorkbook(f);
      const grids=sheets.map(s=>s.grid);
      let {rates}=fwdRatesFromGrids(grids);
      let how="ローカル解析";
      if(!rates.length&&on){
        say(`<span class="spin"></span> 表の構造が特殊なため、AI物流マン（${esc(fwdEngLabel())}）が読み取っています…（10〜40秒）`);
        const text=sheets.map(s=>s.name+"\n"+s.grid.map(r=>(r||[]).join("\t")).join("\n")).join("\n\n");
        rates=await fwdRatesLLM({text}); how=aiHow();
      }
      if(!rates.length) return fail(`表からレーンを特定できませんでした。ヘッダー行に<b>仕出港・仕向港・運賃</b>の列名があるか確認してください。${on?"":"<br>💡 AI物流マンを稼働（下の設定でスタンダード以上＋管理者のエンジン接続）すると、列名が無い表でもAIが読み取れます。"}`);
      return fwdRateDone(rates,how,f.name);
    }

    if(/^(csv|txt)$/.test(ext)){
      say(`<span class="spin"></span> <b>${esc(f.name)}</b> を解析しています…`);
      const text=fwdDecodeText(await f.arrayBuffer());
      const grid=parseCSV(text)[0].grid.map(r=>r.length===1?String(r[0]).split(/[\t;]/).map(s=>s.trim()):r);
      let {rates}=fwdRatesFromGrids([grid]);
      let how="ローカル解析";
      if(!rates.length&&on){
        say(`<span class="spin"></span> AI物流マン（${esc(fwdEngLabel())}）が読み取っています…`);
        rates=await fwdRatesLLM({text}); how=aiHow();
      }
      if(!rates.length) return fail(`行を特定できませんでした。1行目にヘッダー（<b>仕出港,仕向港,形態,運賃,日数</b>）を付けるか、その並び順でお願いします。`);
      return fwdRateDone(rates,how,f.name);
    }
    /* PDF / 画像（AI物流マンが読む。状態別に案内を出し分け） */
    if(/^(pdf|png|jpg|jpeg)$/.test(ext)){
      if(!fwdConnected()){
        return fail(`PDF・画像の読み取りには<b>AIエンジンの接続</b>が必要です。APIキーは<b>STANDAGE管理者が管理コンソールで接続</b>します（お客様の端末にキーは渡りません）。このデモでは、ログイン画面の「STANDAGE管理者」→「AIエンジン設定」から接続できます。<br>💡 接続前でも <b>Excel（.xlsx）・CSV</b> ならこのまま取り込めます。`);
      }
      if(FWDPLAN==="lite"){
        return fail(`現在<b>ライトプラン（内蔵エンジン）</b>のため、PDF・画像のAI読み取りは停止中です。下の<b>「🤖 AI物流マンの稼働設定」でスタンダード（＋3万円/月）以上</b>に変更してください。トライアル中は無料で切り替えられます。<br>💡 Excel（.xlsx）・CSVはライトのままでも取り込めます。`);
      }
      if(!provCanFile(ext)){
        return fail(`接続中のエンジンは、${ext==="pdf"?"PDF":"この形式"}の直接読み取りに対応していません。管理コンソールで<b>Gemini／Claude／ChatGPT系</b>を有効にするか、Excel（.xlsx）・CSVでお願いします。`);
      }
      say(`<span class="spin"></span> AI物流マン（${esc(fwdEngLabel())}）がレート表を読み取っています…（10〜60秒）`);
      const rates=await fwdRatesLLM({att:{mime:FMIME[ext],b64:await fileB64(f),name:f.name}});
      if(!rates.length) return fail("レーンを読み取れませんでした。表が鮮明に写っているかご確認ください。");

  }catch(e){ fail(esc(String(e.message)).slice(0,80)); }
}

  const dz=$("#fwdrop"), fi=$("#fwdfile");
  if(dz&&fi){
    fi.addEventListener("click",e=>e.stopPropagation()); /* input自身のclickがdzへ二重伝播しないように */
    dz.addEventListener("click",()=>fi.click());
    ["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("over");}));
    ["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("over");}));
    const takeAll=async fs=>{ for(const f of fs){ await fwdRateFile(f); } };
    dz.addEventListener("drop",e=>{const fs=[...(e.dataTransfer.files||[])]; if(fs.length) takeAll(fs);});
    fi.onchange=e=>{const fs=[...(e.target.files||[])]; e.target.value=""; if(fs.length) takeAll(fs);};
  }
  const fa=$("#frAdd");
  if(fa) fa.onclick=()=>{
    const pol=($("#frPol").value||"").trim(),pod=($("#frPod").value||"").trim();
    const price=parseInt(($("#frPrice").value||"").replace(/[^\d]/g,""),10);
    if(!pol||!pod||!price){ toast("仕出港・仕向港・運賃を入力してください"); return; }
    FWDB.rates.push({pol,pod,mode:$("#frMode").value,price,cur:"¥",
      unit:/FCL/.test($("#frMode").value)?"/本":"/m³",tt:parseInt($("#frTt").value,10)||10,
      valid:"2026-12-31",note:"手入力"});
    fwdSave(); fwdRender(); toast("レーンを追加しました");
  };
  document.querySelectorAll("[data-frdel]").forEach(b=>b.addEventListener("click",()=>{
    FWDB.rates.splice(+b.dataset.frdel,1); fwdSave(); fwdRender(); toast("削除しました");}));
}
function fwdEnter(){
  document.body.classList.remove("locked");
  const l=$("#lgv"); l&&l.remove();
  if(typeof injectBar==="function") injectBar();
  FWDON=true; fwdCur="finbox";
  fwdLoad(); fwdNav(); fwdRender();
}
/* ── 既存フローへの接続 ── */
const __enterFwd=enterApp;
enterApp=function(){
  if(SES&&SES.t==="trial"&&SES.role==="fwd"){ fwdEnter(); return; }
  __enterFwd();
};
const __renderFwd=render;
render=function(){
  if(FWDON){ fwdRender(); return; }
  __renderFwd();
  if(cur==="ship"&&D&&D.ship) fwdShipBind();
};
/* 出荷ステップ2「運送会社に見積を頼む」のAI商社マンの発話・成果物に組み込む */
const __shipStepsFwd=shipSteps;
shipSteps=function(){
  const ST=__shipStepsFwd();
  if(ST&&ST[1]&&!FWDON){
    ST[1].ai+=`<br><br>さらにこの版では、<b>貿易クラウドに参加している物流会社（${esc(FWDB&&FWDB.profile?FWDB.profile.co:"デモ物流株式会社")}）のAI物流マンへ、その場でAI見積</b>を出せます。`;
    if(ST[1].art) ST[1].art.b+=fwdInlineHtml();
  }
  return ST;
};
/* 起動時（authBootが先に走っている場合の復元セッション対応） */
fwdLoad();
if(typeof SES!=="undefined"&&SES&&SES.t==="trial"&&SES.role==="fwd"&&!FWDON) fwdEnter();

/* ═══ AI商社マン（荷主側）からの物流費・運賃質問 ═══
   物流会社ユーザーの登録レート（FWDB.rates）を直接照会して答える。
   未登録レーンは「未登録」と正直に伝え、AI見積依頼へ誘導する。 */
const SHIP_KW=/物流費|物流コスト|輸送費|輸送コスト|運賃|送料|フレート|freight|海上運賃|航空運賃|船賃|シッピング|配送料/i;
function shipFwdb(){
  try{ if(typeof FWDB==="undefined"||!FWDB||!Array.isArray(FWDB.rates)) fwdLoad(); }catch(e){ return null; }
  return (typeof FWDB!=="undefined"&&FWDB&&Array.isArray(FWDB.rates))?FWDB:null;
}
function shipDest(q){
  q=String(q||"");
  const B=shipFwdb();
  if(B){ for(const r of B.rates){ if(r.pod&&q.includes(r.pod)) return {pod:r.pod,cty:""}; } }
  const hit=Object.keys(FWD_POD).find(c=>q.includes(c))||(q.includes("米国")?"アメリカ":null);
  if(hit) return {pod:FWD_POD[hit],cty:hit};
  const city={"上海":"上海","青島":"青島","天津":"天津","深圳":"深圳","深セン":"深圳","広州":"広州",
    "釜山":"釜山","ロサンゼルス":"ロサンゼルス","ニューヨーク":"ニューヨーク","ドバイ":"ジェベルアリ"};
  for(const k in city){ if(q.includes(k)) return {pod:city[k],cty:""}; }
  return null;
}
function shipRateRows(n){
  const B=shipFwdb(); if(!B) return [];
  return B.rates.slice(0,n||15);
}
function shipRateTbl(rows){
  return `<div class="tw" style="margin-top:8px;max-height:260px"><table><thead>
    <tr><th>レーン</th><th>形態</th><th>運賃</th><th>日数</th><th>有効期限</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.pol)} → ${esc(r.pod)}</b></td><td>${esc(r.mode)}</td>
      <td class="n">${esc(r.cur)}${r.price.toLocaleString()}${esc(r.unit)}</td>
      <td class="n">約${r.tt}日</td><td class="n" style="font-size:10px">${esc(r.valid)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function shipRateCtx(q){
  if(!SHIP_KW.test(String(q))) return "";
  const rows=shipRateRows(15); if(!rows.length) return "";
  const d=shipDest(q);
  const r=d?fwdFindRate(d.pod):null;
  return `=== 社内・物流レートDB（物流会社ユーザーの登録レート） ===
${rows.map(r2=>`${r2.pol}→${r2.pod} ${r2.mode} ${r2.cur}${r2.price.toLocaleString()}${r2.unit}・約${r2.tt}日（有効:${r2.valid}）`).join("\n")}
LCLは別途 THC ¥${FWD_THC.toLocaleString()}＋書類費 ¥${FWD_DOC.toLocaleString()}。
${d?(r?`質問の仕向地の該当レーン: ${r.pol}→${r.pod}（${r.mode} ${r.cur}${r.price.toLocaleString()}${r.unit}・約${r.tt}日）。これを第一根拠に回答する。`
:`質問の仕向地「${d.pod}」のレーンは社内未登録。回答では必ず「社内レートは未登録」と明示し、上の近隣レーンを参考として示し、一般的な市況水準を添える場合は目安であることを断る。正式見積は「出荷を進める」のAI見積依頼を案内する。`):""}`;
}
function shipRateAsk(q,online){
  if(!SHIP_KW.test(String(q))) return null;
  const B=shipFwdb(); if(!B) return null;
  const d=shipDest(q); if(!d) return null;
  const r=fwdFindRate(d.pod);
  const cta=`<p class="nn" style="margin-top:7px">正式なお見積は「出荷を進める」→<b>AI商社マンにまかせる</b>（AI物流マンとの交渉見積）から。物流会社のレート提供には貿易クラウドの物流会社ユーザー登録が前提です。</p>`;
  if(r){
    const ex=fwdQuoteCalc(r,1);
    const near=B.rates.filter(x=>x.pod===r.pod);
    return {a:`<b>${esc(d.cty?d.cty+"（"+d.pod+"）":d.pod)}向けの登録レート</b>（物流会社ユーザー提供・有効:${esc(r.valid)}）：`
      +shipRateTbl(near.length?near:[r])
      +(ex.courier?`<br>小包1個（最小重量帯）目安：<b>¥${ex.total.toLocaleString()}</b>／約${ex.tt}日`
        :`<br>概算例（LCL 1m³の場合）：運賃 ¥${ex.freight.toLocaleString()}＋THC ¥${ex.thc.toLocaleString()}＋書類 ¥${ex.doc.toLocaleString()}＝<b>合計 ¥${ex.total.toLocaleString()}</b>／約${ex.tt}日`)
      +cta,
      c:"社内・物流レートDB（物流会社ユーザーの登録レート）を直接照会"};
  }
  if(online) return null;   /* 接続時はLLMに市況目安まで答えさせる（shipRateCtxで未登録を明示済み） */
  const rows=shipRateRows(12);
  return {a:`<b>${esc(d.pod)}向けの社内登録レートは未登録です</b>（推測の金額はお出ししません）。<br>
現在の登録レーン（横浜発）はこちらです。近い港のレートが目安になります：`
    +shipRateTbl(rows)
    +`<p class="nn" style="margin-top:7px">${esc(d.pod)}のレートが必要な場合：①「出荷を進める」→<b>AI商社マンにまかせる</b>でAI見積を依頼（レーン未登録でも依頼は届きます）②物流会社ユーザーが${esc(d.pod)}レーンをレート表に登録すると、ここで即答できるようになります。</p>`,
    c:"社内・物流レートDB照会（該当レーンなし・正直回答）"};
}
